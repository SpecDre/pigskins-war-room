   before you're back on the clock, and the good ones are gone. A fork that
   hands you both guys is lying to you. So anyone whose board slot comes up
   before my next turn is treated as GONE. */
function playForward(ti, first){

  /* fill a legal roster: what do I still owe? */
  const c = {}; POS.forEach(q=>c[q] = mine.filter(x=>x[3]===q).length);
  const owed = POS.filter(q=>c[q] < NEED[q]);
  const left = RD - mine.length;
  const mustFill = POS.filter(q=>NEED[q]-c[q] > 0)
                      .reduce((s,q)=>s+(NEED[q]-c[q]),0);

  let best=null, bs=-1e9;
  pool.forEach(p=>{
   const q=p[3];
   if(c[q] >= NEED[q]) return;                 // roster cap
   /* if I'm tight on slots, only take what I still owe */
   if(left <= mustFill && !owed.includes(q)) return;
   let v = proj(p);
   /* a bench body is worth much less than a starter */
   const startersHere = {QB:1,RB:2,WR:2,TE:1,K:1,DST:1}[q];
   const have = mine.filter(x=>x[3]===q).length;
   if(have >= startersHere) v *= FLEXABLE.includes(q) ? 0.45 : 0.12;
   if(v > bs){ bs=v; best=p; }

  if(best){ mine.push(best); gone.add(best[0]); }

/* THE FORK: app's pick vs the position Andre wants instead */
function forkFor(ti, altPos){
 const r = bestPick(ti);
 if(!r) return null;
 const rec = r.top.now;

 /* best available at the position he's eyeing */
 /* legal() takes a POSITION string, not a player */
 const alt = av().filter(p=>p[3]===altPos && legal(ti, p[3]) && !isTrap(p))
                 .sort((a,b)=>PROJ(b)-PROJ(a))[0];

 const B = scoreLineup(playForward(ti, alt));
 return { rec, alt, a:A, b:B, diff: Math.round(A.pts - B.pts) };
}

/* ============================================================
   READING THE ROOM — reaches, runs, and what falls to you.

   Andre's whole point: "some guys in my league will reach for players --
   that's where I want you to let me know so we can capitalize on their
   mistakes."

   Two things happen in a real draft room:
     A REACH  — somebody grabs a guy 20+ picks before he should go. That's a
                gift: it means a BETTER player is still sitting there for you.
     A RUN    — three-plus of one position go in a short window. That's a
                warning: if you need that spot, the good ones are evaporating.
   ============================================================ */

/* How early was this pick, really?

   FIRST TRY (wrong): compare the pick to p[5], the public ADP. That flagged 36
   picks a draft in a clean room. Why? Because a smart drafter SHOULD go before
   public ADP on good players — my own engine takes McBride at pick 2 and QBs
   40 picks "early", and that's the strategy working, not a mistake.

   WHAT A REACH ACTUALLY IS: they took a guy when a clearly BETTER player was
   sitting right there. Not "before the public would" — "when someone better
   was available." That's the mistake Andre can capitalize on.

   So: look at the quality rank (blended expert consensus) of who they took vs
   the best guy still on the board when they picked. */
function reachBy(pickNum, p){ return p[5] - pickNum; }   // raw ADP gap (kept for display)

/* the real one: how many better players did they pass over? */
function passedOver(pickNum, p){
 const takenBefore = new Set(picks.slice(0, pickNum-1).map(x=>x.rank));
 /* everyone who was on the board at that moment, better than the guy taken */
 return P.filter(x =>
   !takenBefore.has(x[0]) &&
   x[0] !== p[0] &&
   x[3] !== 'K' && x[3] !== 'DST' &&
   PROJ(x) > PROJ(p) + 25     // meaningfully better in POINTS, not a coin flip
 ).length;
}

/* What actually counts as a reach?
   Measured it: ESPN experts and 1,737 public mocks disagree on the SAME player
   by a median of 9 picks, and 16+ picks a quarter of the time. Biggest gap in
   164 players was 56, and that's a freak.
   So — under ~18 picks is just two rooms disagreeing, not a mistake worth
   telling Andre about. A real reach is 20-35. Past ~45 it stops being useful
   information and starts being noise. */
const REACH_MIN = 20;    // below this, it's just normal disagreement
const REACH_LOUD = 30;   // at/above this, it's a genuinely bad pick

function reaches(minOver){
 const out = [];
 const floor = minOver || REACH_MIN;
 picks.forEach((pk,i)=>{
  const p = P.find(x=>x[0]===pk.rank);
  const pn = i + 1;
  if(!p) return;

  /* K and DEF have no meaningful ADP — nobody agrees when a kicker goes */
  if(p[3]==='K' || p[3]==='DST') return;

  /* WHY THIS ONLY LOOKS AT THE FIRST 6 ROUNDS:

     Ran the detector on clean drafts and it flagged 33 picks each. Looked at
     where they landed: almost all between picks 68 and 117. That's the tell.

     By round 7 every manager is filling REQUIRED slots — you owe 3 QBs, 2 TEs,
     2 kickers, 2 defenses. So when somebody takes a TE in round 9, a "better"
     WR sitting there isn't really available to him; he has to take the TE. My
     detector was calling forced roster picks "reaches."

     A reach is only a reach when you had a FREE CHOICE and blew it. That's the
     early rounds. Past pick 60, everyone's just filling out the roster. */
  if(pn > 60) return;

  /* Same trap in miniature: if a guy's board slot is past the end of the
     draft, his ADP isn't telling us anything useful. */
  if(p[5] > 200) return;

  const over = reachBy(pn, p);
  if(over < floor) return;

  /* THE REAL TEST: did they pass over clearly better players to do it?
     If they took a guy 25 picks early but he was still the best thing on the
     board, that's a smart pick, not a reach. Only flag it if better guys were
     genuinely sitting there. */
  const skipped = passedOver(pn, p);
  if(skipped < 6) return;

  out.push({ pick:pn, team:pk.team, p, over, skipped });
 });
 return out;
}

/* is a position running RIGHT NOW? (last `window` picks) */
function runOn(ps, window){
 const w = window || 12;
 const recent = picks.slice(-w);
 const n = recent.filter(pk=>{
  const p = P.find(x=>x[0]===pk.rank);
  return p && p[3]===ps;
 }).length;
 return n;
}

/* WHO FELL TO ME because somebody reached?
   If a guy is still on the board but his slot has already passed, he's
   sitting there longer than he should — that's value falling into my lap. */
function fallers(ti){
 const pk = picks.length + 1;
 return av()
  .filter(p => legal(ti, p[3]) && !isTrap(p) && p[3]!=='K' && p[3]!=='DST')
  .map(p => ({ p, fell: pk - p[5] }))     // positive = he lasted longer than he should
  .filter(x => x.fell >= 6)
  .sort((a,b) => b.fell - a.fell)
  .slice(0, 4);
}

function roomHtml(ti){
 const L = q => q==='DST'?'DEF':q;
 let h = '';

 /* --- who is on the clock and what do they typically do? --- */
 const onClock = clk();
 if(onClock !== meI()) h += mgrAlert(onClock);

 /* --- somebody just reached (last 6 picks) --- */
 /* just the biggest reach in the last few picks — one alert, not five */
 const recent = reaches(REACH_MIN)
   .filter(r => r.pick > picks.length - 5)
   .sort((a,b) => b.over - a.over)
   .slice(0, 1);
 recent.forEach(r=>{
  const bad = r.over >= REACH_LOUD;
  h += `<div class="alert reach">
    <div class="albl">${bad ? 'BIG REACH' : 'THEY REACHED'}</div>
    <div class="altx"><b>${teams[r.team] ? teams[r.team].name : DEF[r.team]}</b> took
      ${L(r.p[3])} <b>${r.p[1]}</b> at ${r.pick} — he goes around ${r.p[5]}.
      That's <b>${r.over} picks early</b>, and
      <b>${r.skipped} better players</b> were still on the board.
      ${bad ? 'That one hurts them. Go take one.'
            : 'Good for you.'}</div>
   </div>`;
 });

 /* --- a run is on ---
    Careful here: in round 2 every position looks like it's "running" — of
    course 5 RBs went in 12 picks, that's just a draft. A run only MEANS
    something when (a) I still need a starter there, and (b) the guys who
    are actually startable are about to run out. Otherwise it's noise, and
    noise on draft night makes you panic-pick. */
 POS.forEach(ps=>{
  if(ps==='K'||ps==='DST') return;
  if(shy(ti, ps) <= 0) return;              // I don't need one — who cares
  const n = runOn(ps, 10);
  if(n < 4) return;                         // 4+ in 10 picks is a real run
  /* Count from the SAME pool bestPick uses -- legal for me, no traps. Counting
     from the whole board is what made the banner say "6 startable WRs left"
     while The Pick saw 2. */
  const left = av().filter(p=>p[3]===ps && legal(ti,ps) && !isTrap(p) && isStartable(p)).length;
  if(left > 6) return;                      // plenty left, it's not a crisis
  /* REPORT the run. Don't order him to act on it -- The Pick already weighed
     this against everything else on the board. Telling him "MOVE on WR" while
     The Pick says TE is the app arguing with itself. */
  const rec = bestPick(ti);
  const recPs = rec && rec.top.now ? rec.top.now[3] : null;
  const agrees = recPs === ps;
  h += `<div class="alert ${agrees ? 'run' : 'runok'}">
    <div class="albl">${L(ps)} RUN</div>
    <div class="altx"><b>${n} ${L(ps)}s</b> gone in the last 10 picks and only
      <b>${left}</b> worth starting are left — and you still need ${shy(ti,ps)}.
      ${agrees
        ? `That's why The Pick is a ${L(ps)}.`
        : `The Pick still says ${L(recPs)} — that spot is worth more right now, and ${L(ps)} keeps for another round.`}</div>
   </div>`;
 });

 /* --- who fell to you --- */
 const f = fallers(ti);
 if(f.length){
  h += `<div class="alert fell">
    <div class="albl">STILL SITTING THERE</div>
    <div class="altx">${f.map(x=>
      `${L(x.p[3])} <b>${x.p[1]}</b> <span class="fdim">(${x.fell} picks past his slot${LY(x.p)?` · ${Math.round(PROJ(x.p))} pts projected`:''})</span>`
    ).join('<br>')}</div>
   </div>`;
 }
 return h;
}

/* how many options to show in full: 3 or 5. Andre wasn't sure which he

function setFork(ps){ forkPos = (forkPos===ps ? null : ps); bs(); }

function bs(){

 const r = bestPick(m);

 const onClock = clk()===m;
 const {top, rows, slack} = r;
 const L = q => q==='DST' ? 'DEF' : q;

 let h='';

 /* ---------- WHAT THE ROOM JUST DID ---------- */
 h += roomHtml(m);

 /* ---------- THE HEADLINE: take this guy ---------- */

 h += `<div class="tp ${onClock?'live':''}">
   <div class="tphdr">${onClock ? 'TAKE HIM' : 'if it were your pick'}</div>

   ${forkPos ? forkHtml(forkFor(m, forkPos)) : ''}
  </div>`;

 /* ---------- THE RUNNERS-UP ----------
    bestPick() keeps one scored row per position, so rows[1..] are the real
    alternatives — the best guy at each OTHER position. Same depth as the
    headline, because "why not him instead?" is the actual question. */
 {
  /* ranked as individuals, not one-per-position — see topPlayers() */
  const alts = topPlayers(m, altN, r)

 /* ---------- THE COST OF WAITING, position by position ---------- */
 h += `<div class="plnsec">If you wait, here's what you lose</div>`;
 h += `<div class="sckey">now = best you can take · later = best who survives to your next pick</div>`;

 /* This whole panel used to speak in RANKINGS -- it said "costs 22" and put a
    bare "10" next to a player's name, which reads like ten points. Everything
    here is POINTS now: who you get now, who you'd get if you wait, and what
    the wait actually costs you over a season. */
 rows.filter(x=>x.score > -1e8).slice(0,5).forEach(x=>{
  const nowPts   = Math.round(PROJ(x.now));
  const latePts  = x.later ? Math.round(PROJ(x.later)) : 0;
  const ptsLost  = x.later ? Math.max(0, nowPts - latePts) : nowPts;
  const thin = x.need>0 && x.startable>0 && x.startable<=4;
  const hot  = ptsLost >= 35 || thin || !x.later;
  const gone = !x.later;
  h += `<div class="cw ${hot?'hot':''} ${x.ps===top.ps?'pickme':''}">
    <div class="cwtop">
      <span class="plnpos ${x.ps}">${L(x.ps)}</span>

      <span class="cwcost ${hot?'hi':''}">${
        gone ? 'LAST ONE WORTH HAVING'

        : (x.later && (x.later[0] === x.now[0]))

            : 'safe to wait'

      <span class="cwq">${nowPts} pts</span></div>

      x.later ? `${x.later[1]} <span class="cwq">${latePts} pts</span>`
              : 'nobody worth starting'
    }</div>
   </div>`;
 });

 /* ---------- WEAK SPOTS: starting slots held by non-starters ---------- */
 const weak = weakSpots(m);
 if(weak.length){
  h += `<div class="plnsec">Weak spots in your lineup</div>`;
  weak.forEach(w=>{
   h += `<div class="wk">
     <span class="lulbl">${w.slot}</span>
     <span class="wknm">${w.p ? w.p[1] : 'empty'}</span>
     <span class="wkmsg">${w.msg}</span>
    </div>`;
  });
 }

 /* ---------- YOUR STARTING LINEUP RIGHT NOW ---------- */
 h += `<div class="plnsec">Your starting lineup</div>`;
 h += lineupHtml(m);

 el.innerHTML = h;
}


/* Which of my 9 starting slots are held by a guy who isn't really a starter?
   This is the thing that quietly loses leagues: your FLEX is a bench
   body and nothing ever told you. */
function weakSpots(ti){
 const r = ros(ti);
 const by = {};
 /* sort by points, same as everywhere else */
 POS.forEach(q=>{ by[q] = r.filter(x=>x[3]===q).sort((a,b)=>PROJ(b)-PROJ(a)) });
 const out = [];
 const chk = (slot, ps, i) => {
  const p = by[ps] && by[ps][i];
  if(!p){
   if(lft(ti) <= 6) out.push({slot, p:null, msg:'still unfilled'});
   return;
  }
  if(!isStartable(p)){
   out.push({slot, p, msg:`${Math.round(PROJ(p))} pts — below a replacement ${ps==='DST'?'DEF':ps} (${REPL[ps]||0})`});
  }
 };
 chk('QB','QB',0);
 chk('RB1','RB',0); chk('RB2','RB',1);
 chk('WR1','WR',0); chk('WR2','WR',1);   /* WR3 became the FLEX */
 chk('TE','TE',0);
 const fx = bestFlex(ti);
 if(fx && !isStartable(fx))
  out.push({slot:'FLEX', p:fx, msg:'bench-tier — this is a starting spot'});
 return out;
}

/* ============================================================
   SCOUTING REPORT — the recommendation panel's read, on demand

   bestPick() only ever builds a reasoning row for the BEST guy at each
   position, which is why the deep breakdown used to exist for exactly one
   player. rowFor() builds that same row for anybody, so whyText() can
   describe a player Andre picked out himself instead of one we chose.
   ============================================================ */
function rowFor(ti, p){
 const ps = p[3];
 const at = av().filter(x=>x[3]===ps).sort((a,b)=>PROJ(b)-PROJ(a));
 /* the best guy at his position who'd still be there at my next turn --
    excluding this player himself, since the question is "if I pass on HIM" */
 const later = survivesToNextPick(ti, ps)
                 .filter(x=>!isTrap(x) && x[0]!==p[0])
                 .sort((a,b)=>PROJ(b)-PROJ(a))[0];
 const gainNow   = lineupGain(ti, p);
 const gainLater = later ? lineupGain(ti, later) : 0;
 return {
  ps, now:p, later,
  gainNow, gainLater,
  cost: gainNow - gainLater,
  startable: at.filter(x=>isStartable(x)).length,
  need: shy(ti, ps),
  survivors: survivesToNextPick(ti, ps).length
 };
}

/* THE BEST PLAYERS AVAILABLE, as players.

   bestPick() keeps one scored row per POSITION, which is the right shape for
   "which position do I take now?" but the wrong shape for "show me the top
   five guys" — there are only six positions, and early on the engine rules
   out QB/K/DEF outright, so a position-based list caps out at three.
   This ranks individuals using the same two terms that carry the engine's
   own score: what he adds to my starting lineup, and what he beats a
   replacement starter by. Positions the engine has ruled out stay ruled out. */
function topPlayers(ti, n, rec){
 const alive = new Set(rec.rows.filter(r=>r.score > -1e8).map(r=>r.ps));
 const byPos = {};
 av().filter(p=>alive.has(p[3]) && legal(ti,p[3]) && !isTrap(p))
     .forEach(p=>{ (byPos[p[3]] = byPos[p[3]] || []).push(p) });
 /* nobody outside the front of a position is winning this, so only score the
    top few per spot rather than all 290 available players */
 const cands = [];
 Object.values(byPos).forEach(list=>{
  list.sort((a,b)=>PROJ(b)-PROJ(a)).slice(0, n).forEach(p=>cands.push(p));
 });
 return cands
   .map(p=>({p, s: lineupGain(ti,p) + VOR(p)*0.42}))
   .sort((a,b)=>b.s-a.s)
   .map(x=>x.p);
}

/* The full read for one player.
   opts.row   — a reasoning row bestPick() already built. Pass it when you
                have one: rowFor() re-runs survivesToNextPick/lineupGain, and
                doing that per card is exactly the kind of cost that got the
                full playout dropped for being too slow on a phone.
   opts.rec   — bestPick() result, so we can mark the app's own pick.
   opts.label — override the header ("#2 OPTION"). */
function scoutHtml(p, ti, opts){
 const o = opts || {};
 const L = q => q==='DST' ? 'DEF' : q;
 const row = o.row || rowFor(ti, p);
 const rec = o.rec;
 const isRec = rec && rec.top && rec.top.now && rec.top.now[0] === p[0];
 const nowPts  = Math.round(PROJ(p));
 const latePts = row.later ? Math.round(PROJ(row.later)) : 0;
 const lost    = row.later ? Math.max(0, nowPts - latePts) : nowPts;
 /* the other direction: the guy who survives is BETTER than the one you're
    looking at, which means taking this one now is a reach. Worth saying out
    loud — "about the same, safe to wait" badly undersells a 78-point gap. */
 const better  = row.later ? latePts - nowPts : 0;
 /* a bestPick row doesn't exclude the player himself from `later` — if he's
    the guy who survives, that's a coin flip, not a promise */
 const sameGuy = row.later && row.later[0] === p[0];

 let h = `<div class="scout" data-r="${p[0]}">
   <div class="scouthdr ${isRec?'rec':''}">${
     o.label ? o.label : isRec ? "★ THIS IS THE APP'S PICK" : 'SCOUTING REPORT'
   }</div>
   <div class="tpname"><span class="plnpos ${p[3]}">${L(p[3])}</span> ${p[1]}</div>
   <div class="tpsub">${p[2]} · goes around pick ${p[5]} · bye ${p[8]||'—'}</div>
   <div class="tpwhy">${whyText(row, null, ti)}</div>`;

 /* the cost-of-waiting question, asked about THIS guy specifically */
 h += `<div class="scoutwait">
   <div class="swl">If you pass on him</div>
   <div class="swr">${
     !row.later
       ? `Nobody worth starting at ${L(row.ps)} survives to your next pick. He's the last one.`
     : sameGuy
       ? `He might still be there at your next pick — but that's a coin flip, not a plan.`
     : better >= 12
       ? `<b>${row.later[1]}</b> (${latePts} pts) should still be there at your next pick — <span class="swcost">that's ${better} pts better than this guy</span>. Taking him now is a reach.`
       : `Best ${L(row.ps)} left at your next pick is <b>${row.later[1]}</b> (${latePts} pts)` + (
           lost >= 12 ? ` — <span class="swcost">passing costs you ${lost} pts</span>.`
         : ` — about the same. Safe to wait.`)
   }</div>
  </div>`;

 return h + `</div>`;
}

 /* only show if he doesn't already have the handcuff */
 const alreadyHave = ros(ti).some(x=>x[1]===pair.hc);

function whyText(top, rows, ti){

 const pj = PROJ(p), vor = VOR(p);

 /* No NFL snaps — say so plainly instead of pretending we know. */
 if(YRS(p) === 0)
  return `Rookie — no NFL tape to go on. The experts have him ${L(top.ps)}${PRK(p)}, which works out to about ${Math.round(pj)} points. That's their read, not a track record.${handcuffNote(p, ti)}` + playerBadges(p, ti);

 /* Three steady years is the strongest thing you can say about a player. */
 if(SOLID(p) && vor >= 90)
  return `Three straight years of this — he barely moves. Projects to ${Math.round(pj)}, about ${Math.round(vor)} better than a replacement ${L(top.ps)}. Set and forget.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(SOLID(p))
  return `Steady three years running. ${Math.round(pj)} projected. You know exactly what you're getting.${handcuffNote(p, ti)}` + playerBadges(p, ti);

 /* Up-and-down guy — the projection is a guess, and we should say so. */
 if(BOUNCY(p) && vor >= 90)
  return `Big edge if he hits — ${Math.round(vor)} over a replacement ${L(top.ps)}. But he's bounced around, so ${Math.round(pj)} is the middle of a wide range.${handcuffNote(p, ti)}` + playerBadges(p, ti);

 if(vor >= 120)
  return `Projects to ${Math.round(pj)} — ${Math.round(vor)} more than a replacement ${L(top.ps)}. One of the biggest edges on the board.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(vor >= 70)
  return `${Math.round(pj)} projected, ${Math.round(vor)} better than a replacement ${L(top.ps)}. Real starter.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(!top.later)
  return `Last ${L(top.ps)} worth starting. Nobody good is left at your next pick.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(top.cost >= 30)
  return `Take him now. If you wait, the best ${L(top.ps)} left is ${top.later[1]} — big step down.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(top.need > 0 && top.startable > 0 && top.startable <= 4)
  return `Only ${top.startable} startable ${L(top.ps)}${top.startable>1?'s':''} left. Every team needs one. This is the window.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 if(pj > 0)
  return `${Math.round(pj)} projected. Best value on the board for your lineup right now.${handcuffNote(p, ti)}` + playerBadges(p, ti);
 return `Best value on the board for your lineup right now.${handcuffNote(p, ti)}` + playerBadges(p, ti);
}

 let h=`<div class="warn2">This is NOT the team on the clock.<br>Only use this to fix a mistake or log a trade.</div>`;
 teams.forEach((t,i)=>{ if(i===o) return;
  h+=`<button class="mbt ${t.isMe?'m2':''}" data-t="${i}">${t.name}</button>`});
 d.innerHTML=h;
 d.classList.add('open');
};
document.getElementById('drawer').onclick=function(e){
 const b=e.target.closest('.mbt'); if(!b||pend===null)return;
 const ti=+b.dataset.t;
 if(!confirm(`Assign ${P.find(x=>x[0]===pend)[1]} to ${teams[ti].name}?\n\nThis is not the team on the clock.`))return;
 picks.push({rank:pend,team:ti});
 pend=null;
 document.getElementById('md').classList.remove('on2');
 if(auto) runAuto(); else pt();
};
document.getElementById('mdc').onclick=()=>{pend=null;document.getElementById('md').classList.remove('on2')};
document.getElementById('md').onclick=e=>{if(e.target.id==='md'){pend=null;e.target.classList.remove('on2')}};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&pend!==null){pend=null;document.getElementById('md').classList.remove('on2')}});

document.getElementById('bd').onclick=e=>{const r=e.target.closest('.rw');if(r)op(+r.dataset.r)};
document.getElementById('bd').onkeydown=e=>{const r=e.target.closest('.rw');
 if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();op(+r.dataset.r)}};
document.getElementById('p-bs').onclick=e=>{
 /* the big recommendation name and the Draft button both open the pick modal */
 const d=e.target.closest('.tpdraft'); if(d){op(+d.dataset.r);return}
 const n=e.target.closest('.tpclick'); if(n){op(+n.dataset.r);return}
 const b=e.target.closest('.ba');if(b){op(+b.dataset.r);return}
 /* the "other options" cards draft too — read the case, tap, confirm.
    Only in the rail: the modal's own scout card has no handler. */
 const s=e.target.closest('.scout');if(s&&s.dataset.r)op(+s.dataset.r)};
/* rename a team mid-draft from the Rosters tab — no reset needed */
document.getElementById('p-rs').addEventListener('input', e=>{
 const i=e.target.closest('.tnedit');
 if(!i) return;
 const ti=+i.dataset.t;
 if(teams[ti]){ teams[ti].name=i.value; sv(); }
});
/* '/' jumps to player search (desktop nicety; phones have thumbs) */
document.addEventListener('keydown',e=>{
 if(e.key!=='/'||e.ctrlKey||e.metaKey)return;
 const q=document.getElementById('q');
 if(!q||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(document.getElementById('wr').style.display==='none'||!document.getElementById('wr').style.display)return;
 e.preventDefault();q.focus()});
document.querySelector('.ct').onclick=e=>{const b=e.target.closest('.fb');if(!b)return;
 flt=b.dataset.p;document.querySelectorAll('.fb').forEach(x=>x.classList.toggle('on2',x===b));bd()};
document.getElementById('q').oninput=bd;
document.getElementById('ht').onchange=e=>{hideT=e.target.checked;bd()};
document.querySelector('.rt').onclick=e=>{const t=e.target.closest('.rtb');if(!t)return;
 document.querySelectorAll('.rtb').forEach(x=>x.classList.toggle('on2',x===t));
 document.querySelectorAll('.rp').forEach(p=>p.classList.toggle('on2',p.id==='p-'+t.dataset.p))};
document.querySelector('.vsw').onclick=e=>{
 const b=e.target.closest('.vb'); if(!b)return;
 document.querySelectorAll('.vb').forEach(x=>x.classList.toggle('on2',x===b));
 const isGrid = b.dataset.v==='grid';
 document.getElementById('bd').style.display = isGrid?'none':'block';
 document.getElementById('ctrls').style.display = isGrid?'none':'flex';
 document.getElementById('gridwrap').classList.toggle('on2', isGrid);
 if(isGrid) grid();
};
document.getElementById('ab').onclick=()=>{
 auto = !auto;
 if(auto) runAuto();
 else pt();
};
/* shift-click Auto = simulate the ENTIRE draft, your picks included */
document.getElementById('ab').addEventListener('click', e=>{
 if(!e.shiftKey) return;
 auto = false;
 autoAll();
});
document.getElementById('ub').onclick=()=>{
 if(!picks.length)return;
 const last=picks[picks.length-1];
 const pl=P.find(x=>x[0]===last.rank);
 if(confirm(`Undo last pick?\n\n${pl[1]} → ${teams[last.team].name}`)){picks.pop();pt()}
};
document.getElementById('rb').onclick=()=>{
 if(!confirm('Start over?\n\nThis wipes every pick and returns you to the draft order screen.'))return;
 hardReset();
};
function hardReset(){
 // 1. wipe memory FIRST — this is what actually matters
 picks=[]; teams=[]; auto=false; flt='ALL'; hideT=true;
 // 2. try storage (may be blocked on file:// — don't depend on it)
 try{ localStorage.removeItem(LS); }catch(e){}
 try{ localStorage.clear(); }catch(e){}
 // 3. redraw in place. no reload — reload can resurrect stale data on file://
 order=DEF.slice(); meIdx=6;
 document.getElementById('wr').style.display='none';
 document.getElementById('su').style.display='block';
 document.body.style.background='';   /* stylesheet owns the glass backdrop */
 const md=document.getElementById('md'); if(md)md.classList.remove('on2');
 pend=null;
 const q=document.getElementById('q'); if(q)q.value='';
 drawSetup();
 window.scrollTo(0,0);
}

function go(){document.getElementById('su').style.display='none';
 document.getElementById('wr').style.display='block';
 document.body.style.background='';   /* stylesheet owns the glass backdrop */
 if(auto)runAuto(); else pt()}
// boot: wait for DOM then restore or fresh setup
function boot(){
 order = DEF.slice();   // guarantee order is populated
 if(ld() && teams.length===NT && teams.some(t=>t.isMe)) go();
 else { picks=[]; teams=[]; drawSetup(); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script></body></html>
