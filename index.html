<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pigskins 2026 · War Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  /* GLASS THEME — one dark translucent system instead of black chrome +
     white board. The old names stay (hundreds of rules reference them);
     only the values changed. "blk" = chrome glass, "wht" = board glass. */
  --blk:rgba(13,16,24,.72);          /* chrome glass — blurred where sticky */
  --blk2:rgba(255,255,255,.055);     /* raised: rail cards, inputs */
  --blk3:rgba(255,255,255,.13);      /* borders / hover */
  --onblk:#f2f4f8;                   /* text on chrome */
  --onblk2:#9aa3b5;                  /* dim text */
  --onblk3:#78829a;
  /* board — was white, now glass. ink lifted to stay legible on dark */
  --wht:rgba(18,22,31,.55);
  --wht2:rgba(255,255,255,.045);     /* stripe / taken */
  --wht3:rgba(255,255,255,.085);     /* hover */
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.17);
  --ink:#eef1f6;
  --ink2:#b3bbcc;
  --ink3:#97a1b6;        /* lifted: the panel scrim is lighter now */
  /* accent */
  --red:#e5253b;
  --red-dk:#c0142a;
  --red-lt:#ff5468;       /* red on dark — lifted for contrast */
  --red-bg:rgba(229,37,59,.13);
  --grn:#2fc46f;
  --amb:#f5a623;
  --blu:#5aa2ff;
  /* position pills */
  --qb:#b8145c; --rb:#00796b; --wr:#1976d2; --te:#ef6c00; --k:#6b7480; --dst:#546070;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--wht);color:var(--ink);
 -webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}

/* ================= SETUP — black canvas ================= */
#su{max-width:600px;margin:0 auto;padding:36px 20px 60px}
body:has(#su:not([style*="none"])){background:var(--blk)}
#su .h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--onblk)}
#su .h1 span{color:var(--red-lt)}
#su .h2{font-family:'JetBrains Mono';font-size:11px;color:var(--onblk2);letter-spacing:.06em;
 text-transform:uppercase;margin-top:8px;font-weight:500}
.nt{margin:22px 0 16px;padding:14px 16px;background:var(--blk2);border-left:3px solid var(--red);
 border-radius:8px;font-size:13px;line-height:1.6;color:var(--onblk)}
.nt b{color:var(--red-lt);font-weight:700}
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tl{font-size:12px;font-weight:600;background:transparent;border:1px solid var(--blk3);
 color:var(--onblk2);padding:9px 14px;border-radius:7px;transition:.12s}
.tl:hover{border-color:var(--red);color:var(--red-lt)}
.or{display:flex;align-items:center;gap:9px;margin-bottom:7px;background:var(--blk2);
 border:1px solid var(--blk3);border-radius:8px;padding:7px 9px;transition:.12s}
.or.drag{opacity:.35}
.or.over{border-color:var(--red);box-shadow:0 0 0 2px rgba(229,37,59,.25)}
.grip{color:var(--onblk3);cursor:grab;font-size:15px;user-select:none;padding:0 2px}
.grip:active{cursor:grabbing}
.on{font-family:'JetBrains Mono';font-weight:700;font-size:13px;width:26px;text-align:center;
 color:var(--red-lt);background:rgba(229,37,59,.14);border-radius:5px;padding:4px 0}
.oi{flex:1;background:transparent;border:0;color:var(--onblk);padding:7px 4px;font-size:15px;font-weight:600}
.oi:focus{outline:0}
.arw{display:flex;flex-direction:column;gap:2px}
.ab{background:var(--blk);border:1px solid var(--blk3);color:var(--onblk3);width:24px;height:16px;
 line-height:1;border-radius:4px;font-size:8px;padding:0}
.ab:hover{border-color:var(--red);color:var(--red-lt)}
.mb2{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:transparent;
 border:1px solid var(--blk3);color:var(--onblk3);padding:8px 12px;border-radius:6px;transition:.12s}
.mb2.on2{background:var(--red);border-color:var(--red);color:#fff}
.go{width:100%;margin-top:20px;padding:16px;background:var(--red);border:0;border-radius:8px;
 font-weight:700;font-size:15px;color:#fff;transition:.12s}
.go:hover{background:var(--red-dk)}
.go:disabled{background:var(--blk3);color:var(--onblk3);cursor:not-allowed}

/* ================= HEADER — black ================= */
#wr{display:none}
header{background:var(--blk);border-bottom:3px solid var(--red);padding:12px 16px;
 position:sticky;top:0;z-index:60}
.hr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.oc{min-width:0}
.oc .l{font-family:'JetBrains Mono';font-size:9px;color:var(--onblk3);letter-spacing:.11em;
 text-transform:uppercase;font-weight:600}
.oc .w{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--onblk);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;max-width:215px;line-height:1.25}
.oc .w.me{color:var(--red-lt)}
.pnu{font-family:'JetBrains Mono';font-size:11px;color:var(--onblk2);white-space:nowrap;font-weight:500}
.nxt{font-family:'JetBrains Mono';font-size:10px;color:var(--onblk3);white-space:nowrap}
.um{margin-left:auto;text-align:right}
.um .l{font-family:'JetBrains Mono';font-size:9px;color:var(--onblk3);letter-spacing:.11em;
 text-transform:uppercase;font-weight:600}
.um .n{font-size:23px;font-weight:800;color:var(--onblk);line-height:1.2}
.um .n.now{color:var(--red-lt)}
.hb{font-size:11px;font-weight:600;background:transparent;border:1px solid var(--blk3);
 color:var(--onblk2);padding:8px 11px;border-radius:6px;transition:.12s}
.hb:hover{border-color:var(--onblk3);color:var(--onblk)}
.hb.w:hover{border-color:var(--red);color:var(--red-lt)}
.hb.auto{border-color:#3d6ea8;color:#8ab8f0}
.hb.auto:hover{background:rgba(61,110,168,.18)}
.hb.auto.on2{background:#3d6ea8;border-color:#3d6ea8;color:#fff}

/* alerts — on black */
.itl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cd{padding:10px 13px;border-radius:7px;font-size:13px;line-height:1.5;border-left:3px solid;
 background:var(--blk2);color:var(--onblk)}
.cd b{font-weight:700}
.cd.sn{border-color:var(--amb)}.cd.sn b{color:#ffb340}
.cd.rn{border-color:var(--red)}.cd.rn b{color:var(--red-lt)}
.cd.cl{border-color:var(--amb)}.cd.cl b{color:#ffb340}
.cd.stl{border-color:#4a90e2}.cd.stl b{color:#7db8f5}
.cd.qbw{border-color:var(--red);background:rgba(229,37,59,.12)}.cd.qbw b{color:var(--red-lt)}
.cd.dl{border-color:#ff8c42;background:rgba(255,140,66,.16)}.cd.dl b{color:#ffb340}

.gr{display:grid;grid-template-columns:1fr 330px}
@media(max-width:900px){
 .gr{grid-template-columns:1fr}
 /* on mobile, flip the rail above the board */
 .gr{display:flex;flex-direction:column}
 .rl{order:-1;border-left:0;border-top:0;border-bottom:2px solid var(--red);
     position:static;max-height:none}
 /* collapse the rail to just The Pick tab by default */
 .rt{display:none}
 .rp{display:none!important}
 .rp.on2{display:block!important}
 #mob-pick{display:block}
}
@media(min-width:901px){#mob-pick{display:none}}

/* ================= CONTROLS — black strip ================= */
.ct{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;align-items:center;background:var(--blk);
 border-bottom:1px solid var(--blk3);position:sticky;top:var(--hh,0);z-index:50}
#q{flex:1;min-width:120px;background:var(--blk2);border:1px solid var(--blk3);border-radius:7px;
 color:var(--onblk);padding:8px 12px;font-size:13px}
#q:focus{outline:0;border-color:var(--red)}
#q::placeholder{color:var(--onblk3)}
.fb{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:transparent;
 border:1px solid var(--blk3);color:var(--onblk2);padding:7px 11px;border-radius:6px;transition:.12s}
.fb:hover{border-color:var(--onblk3);color:var(--onblk)}
.fb.on2{background:var(--red);border-color:var(--red);color:#fff}
.tg{font-size:11px;color:var(--onblk2);display:flex;align-items:center;gap:5px;user-select:none;font-weight:500}
.tg input{accent-color:var(--red)}

/* ================= BOARD — white ================= */
.bd{padding:0 16px 40px;min-height:100vh;background:var(--wht)}
.tr{display:flex;justify-content:space-between;gap:10px;align-items:center;
 margin:16px 0 2px;padding:9px 12px;background:var(--blk);border-radius:7px}
.tr span:first-child{font-size:12px;font-weight:700;color:var(--onblk)}
.tr em{font-style:normal;font-size:11px;color:var(--onblk2);font-weight:500}
.tr .lf{font-family:'JetBrains Mono';font-size:10px;color:var(--onblk3);white-space:nowrap;font-weight:600}
.tr .lf.tn{color:var(--red-lt)}

.rw{display:grid;grid-template-columns:30px 1fr 42px 40px 18px 46px 26px 54px;gap:8px;align-items:center;
 padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.rw:hover{background:var(--wht3)}
.rw:focus-visible{outline:2px solid var(--red);outline-offset:-2px;border-radius:5px}
.rk{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);text-align:right;font-weight:500}
.nm{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.tm{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);font-weight:500}
.pt{font-size:10px;font-weight:800;letter-spacing:.03em;text-align:center;padding:4px 0;
 border-radius:4px;color:#fff}
.pt.QB{background:var(--qb)}.pt.RB{background:var(--rb)}.pt.WR{background:var(--wr)}
.pt.TE{background:var(--te)}.pt.K{background:var(--k)}.pt.DST{background:var(--dst)}
.ar{font-family:'JetBrains Mono';font-size:12px;font-weight:700;text-align:center}
.ar.u{color:var(--grn)}.ar.d{color:var(--red)}
.vl{font-family:'JetBrains Mono';font-size:11px;text-align:right;color:var(--ink3);font-weight:500}
.vl.good{color:var(--blu);font-weight:700}
.vl.bad{color:var(--red);font-weight:700}
.by{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3);text-align:center}
.tk2{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3);text-align:right;overflow:hidden;
 white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.rw.tkn{opacity:.42;background:var(--wht2)}
.rw.tkn .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink3)}
.rw.mine{background:var(--red-bg);box-shadow:inset 4px 0 0 var(--red)}
.rw.mine .nm{font-weight:700;color:var(--red-dk)}
.rw.mine .tk2{color:var(--red);font-weight:700}
.rw.tgt{box-shadow:inset 4px 0 0 var(--amb)}
.rw.tgt .nm::after{content:' ★';color:var(--amb);font-size:11px}
.rw.qbtrap .nm::after{content:' ⚠';color:var(--red);font-size:11px}
/* value trap: the room overdrafts him, experts don't */
.rw.trap{background:rgba(229,37,59,.06)}
.rw.trap .nm{color:#b02030}
.rw.trap .nm::after{content:' TRAP';font-size:8px;font-weight:800;color:#fff;
 background:var(--red);padding:2px 4px;border-radius:3px;margin-left:5px;letter-spacing:.04em}
.rw.trap .vl{color:var(--red);font-weight:700}
.flag{font-size:8px;font-weight:800;padding:2px 4px;border-radius:3px;margin-left:5px;
 letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
.flag.nr{background:#7c2d12;color:#ffd4b8}
.flag.up{background:#065f46;color:#a7f3d0}
.flag.dn{background:#7f1d1d;color:#fecaca}
/* locked: taking this would strand your roster */
.rw.locked{opacity:.34;background:repeating-linear-gradient(45deg,var(--wht2),var(--wht2) 6px,#f0f1f4 6px,#f0f1f4 12px);cursor:not-allowed}
.rw.locked .nm{color:var(--ink3)}
.rw.locked .nm::after{content:' 🔒';font-size:10px;opacity:.7}
.rw.locked:hover{background:repeating-linear-gradient(45deg,var(--wht2),var(--wht2) 6px,#f0f1f4 6px,#f0f1f4 12px)}
.hd{display:none!important}

/* ================= RAIL — black ================= */
.rl{background:var(--blk);border-left:1px solid var(--blk3);position:sticky;top:var(--hh,0);
 max-height:calc(100vh - var(--hh,0));overflow-y:auto;padding-bottom:26px}
@media(max-width:900px){.rl{position:static;max-height:none;border-left:0;border-top:2px solid var(--red)}}
.rt{display:flex;border-bottom:1px solid var(--blk3);position:sticky;top:0;background:var(--blk);z-index:5}
.rtb{flex:1;font-size:12px;font-weight:700;background:transparent;border:0;color:var(--onblk3);
 padding:13px 4px;border-bottom:2px solid transparent;transition:.12s}
.rtb:hover{color:var(--onblk2)}
.rtb.on2{color:var(--red-lt);border-bottom-color:var(--red)}
.rp{display:none;padding:12px}.rp.on2{display:block}

.mx{width:100%;border-collapse:collapse;font-size:11px}
.mx th{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--onblk3);padding:8px 2px;
 text-align:center;border-bottom:1px solid var(--blk3)}
.mx th:first-child{text-align:left}
.mx td{font-family:'JetBrains Mono';padding:8px 2px;text-align:center;
 border-bottom:1px solid var(--blk3);font-weight:600;color:var(--onblk2)}
.mx td:first-child{text-align:left;font-family:'Inter';font-size:12px;font-weight:600;
 color:var(--onblk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.mx tr.me td{background:rgba(229,37,59,.13)}
.mx tr.me td:first-child{color:var(--red-lt);font-weight:700}
.mx tr.ck td{box-shadow:inset 0 -2px 0 var(--amb)}
.nd{color:var(--red-lt)!important;font-weight:800}
.fl{color:#4ade80!important}
.zr{color:var(--onblk3)!important}
.ky{font-size:10px;color:var(--onblk3);margin-top:10px;line-height:1.6}
.ky b{color:var(--red-lt)}

.tb{margin-bottom:12px;background:var(--blk2);border:1px solid var(--blk3);border-radius:8px;
 padding:10px 12px}
.tn2{font-size:13px;font-weight:700;color:var(--onblk);padding-bottom:7px;
 border-bottom:1px solid var(--blk3);display:flex;justify-content:space-between;
 align-items:baseline;margin-bottom:4px}
.tn2.me{color:var(--red-lt)}
.tn2 small{font-family:'JetBrains Mono';font-size:9px;color:var(--onblk3);font-weight:500}
/* editable team names — inline input on the Rosters tab, rename mid-draft */
.tnedit{background:transparent;border:0;border-bottom:1px dashed transparent;color:inherit;
 font:inherit;padding:1px 2px;max-width:150px;-webkit-user-select:text;user-select:text;
 touch-action:manipulation}
.tnedit:focus{outline:0;border-bottom-color:var(--red);background:rgba(255,255,255,.06)}
.pk{display:flex;gap:7px;padding:5px 0;font-size:12px;align-items:center;
 border-bottom:1px solid var(--blk3);color:var(--onblk)}
.pk:last-child{border-bottom:0}
.pk .pp{font-size:9px;font-weight:800;padding:3px 5px;border-radius:4px;min-width:28px;
 text-align:center;color:#fff}
.pk .pp.QB{background:var(--qb)}.pk .pp.RB{background:var(--rb)}.pk .pp.WR{background:var(--wr)}
.pk .pp.TE{background:var(--te)}.pk .pp.K{background:var(--k)}.pk .pp.DST{background:var(--dst)}
.pk .pnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pk .prk{font-family:'JetBrains Mono';font-size:9px;color:var(--onblk3)}
.em{font-size:11px;color:var(--onblk3);padding:8px 0;font-style:italic}

.bh{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
 color:var(--onblk3);margin:6px 0 8px}
.ba{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--blk3);
 font-size:13px;cursor:pointer;border-radius:5px;color:var(--onblk);transition:.1s}
.ba:hover{background:var(--blk2)}
.ba .r2{font-family:'JetBrains Mono';font-size:10px;color:var(--onblk3);width:22px;font-weight:500}
.ba .n2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ba .p2{font-size:9px;font-weight:800;padding:3px 5px;border-radius:4px;color:#fff}
.ba .p2.QB{background:var(--qb)}.ba .p2.RB{background:var(--rb)}.ba .p2.WR{background:var(--wr)}
.ba .p2.TE{background:var(--te)}.ba .p2.K{background:var(--k)}.ba .p2.DST{background:var(--dst)}
.ba .rs{font-family:'JetBrains Mono';font-size:9px;width:34px;text-align:right;font-weight:600;
 color:var(--onblk2)}
.ba .rs.h{color:var(--red-lt)}
.ba .rs.lo{color:#4ade80}

/* ================= MODAL — white card, black header ================= */
.md{display:none;position:fixed;inset:0;background:rgba(10,11,14,.6);z-index:100;
 align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.md.on2{display:flex}
.mbx{background:var(--wht);border-radius:14px;max-width:400px;width:100%;padding:0 20px 20px;
 box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}
.whose{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
 padding:13px;margin:0 -20px 16px;text-align:center}
.whose.mine{background:var(--red);color:#fff}
.whose.theirs{background:var(--blk);color:var(--onblk2)}
.mt{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--ink)}
.ms{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);margin-bottom:16px;font-weight:500}
.warnbox{background:var(--red-bg);border:1px solid #ffc9d0;border-left:3px solid var(--red);
 border-radius:7px;padding:12px 13px;margin-bottom:14px;font-size:12px;line-height:1.55;color:#7d1122}
.warnbox b{color:var(--red-dk);font-weight:700}
.mbt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;background:var(--wht);
 border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;font-weight:600;transition:.12s}
.mbt:hover{border-color:var(--red);background:var(--red-bg)}
.mbt.big{background:var(--red);color:#fff;font-weight:700;text-align:center;border-color:var(--red);
 padding:15px;font-size:15px}
.mbt.big:hover{background:var(--red-dk)}
.mbt.m2{color:var(--red);font-weight:700}
.ovr{width:100%;margin-top:10px;padding:10px;background:transparent;border:1px dashed var(--line2);
 border-radius:7px;color:var(--ink3);font-size:11px;font-weight:600;transition:.12s}
.ovr:hover{color:var(--ink2);border-color:var(--ink3)}
.drawer{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.drawer.open{display:block}
.drawer .warn2{font-size:10px;color:var(--red);margin-bottom:9px;line-height:1.5;
 text-align:center;font-weight:600}
.mc{width:100%;margin-top:8px;padding:11px;background:transparent;border:1px solid var(--line);
 border-radius:7px;color:var(--ink3);font-size:12px;font-weight:600}
.mc:hover{color:var(--red);border-color:var(--red)}

/* ===== view switcher ===== */
.vsw{display:flex;gap:0;background:var(--blk);padding:0 16px;border-bottom:1px solid var(--blk3)}
.vb{font-size:12px;font-weight:700;background:transparent;border:0;color:var(--onblk3);
 padding:12px 18px;border-bottom:2px solid transparent;transition:.12s}
.vb:hover{color:var(--onblk2)}
.vb.on2{color:var(--red-lt);border-bottom-color:var(--red)}

/* ===== DRAFT GRID — every pick, every team ===== */
.gridwrap{display:none;padding:14px 16px 50px;overflow-x:auto;background:var(--wht)}
.gridwrap.on2{display:block}
.dg{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.dg th{background:var(--blk);color:var(--onblk);font-size:10px;font-weight:700;padding:9px 6px;
 text-align:center;white-space:nowrap;position:sticky;top:0;z-index:3;
 border-right:1px solid var(--blk3);max-width:92px;overflow:hidden;text-overflow:ellipsis}
.dg th:first-child{position:sticky;left:0;z-index:4;background:var(--blk);width:34px;min-width:34px}
.dg th.meCol{background:var(--red);color:#fff}
.dg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;
 vertical-align:top;width:92px;min-width:92px}
.dg td.rdnum{position:sticky;left:0;z-index:2;background:var(--blk);color:var(--onblk2);
 font-family:'JetBrains Mono';font-weight:700;font-size:10px;text-align:center;
 width:34px;min-width:34px;padding:8px 0;border-right:1px solid var(--blk3)}

/* ============================================================
   GLASS SURFACES — everything below assumes the :root remap above.
   The palette flip does most of the work; this section adds the
   backdrop the glass shows through, blur on the sticky chrome, and
   spot-fixes for rules that hardcoded white-board colors.
   ============================================================ */

/* THE WORLD BEHIND THE GLASS.
   This has to be genuinely colorful or nothing above it reads as glass —
   translucency over a uniformly dark page is indistinguishable from a flat
   dark panel. That was the first attempt's mistake: 12-17% glows over
   near-black showed through as nothing. These are bright and large, so the
   frosted surfaces above have something to actually diffuse. */
body, body:has(#su:not([style*="none"])){background:#080b12}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(1100px 700px at 86% -10%, rgba(229,37,59,.55), transparent 60%),
 radial-gradient(980px 700px at -10% 22%, rgba(41,121,255,.42), transparent 58%),
 radial-gradient(900px 640px at 58% 108%, rgba(0,190,160,.34), transparent 56%),
 radial-gradient(700px 520px at 30% 52%, rgba(150,60,220,.26), transparent 60%),
 linear-gradient(180deg,#0a0e16,#070910)}

/* the sticky chrome is what sells the effect — board rows scroll
   underneath it, blurred */
header,.ct,.vsw,.rt{
 background:rgba(12,16,26,.55);
 backdrop-filter:blur(26px) saturate(1.7);
 -webkit-backdrop-filter:blur(26px) saturate(1.7)}
header{border-bottom-color:rgba(229,37,59,.85)}
.rl{backdrop-filter:blur(22px) saturate(1.5);
 -webkit-backdrop-filter:blur(22px) saturate(1.5)}

/* CARDS — frosted, not just dark.
   A pale white wash (not a dark fill) is what makes a surface look like
   glass: it lets the colored backdrop through while the blur diffuses it.
   Filling these dark would hide the backdrop and we'd be back to flat. */
.nt,.or,.tb,.cd,.plnhdr,.plnproj,.scrow,.pocard,.tr,.scout{
 background:rgba(255,255,255,.07);
 backdrop-filter:blur(18px) saturate(1.5);
 -webkit-backdrop-filter:blur(18px) saturate(1.5);
 border:1px solid rgba(255,255,255,.14);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 10px 30px rgba(0,0,0,.32)}
.cd,.nt,.plnproj{border-left-width:3px}

/* FLOATING PANELS — the piece the first two attempts were missing.
   The board and rail covered the viewport edge to edge, so the colored
   backdrop was never visible anywhere and nothing read as sitting ON
   something. Insetting them opens gutters where the backdrop shows
   through directly, which is what makes the panels look like glass laid
   over a surface rather than just dark boxes.

   No overflow:hidden on the column — .ct sticks to the top while scrolling
   and any clipping ancestor would silently break that. Corners are
   rounded on the first and last children instead. */
.gr{padding:12px;gap:12px;align-items:start}
.gr>div:first-child,.rl{
 border:1px solid rgba(255,255,255,.13);
 border-radius:16px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 18px 50px rgba(0,0,0,.42)}
.gr>div:first-child{background:rgba(10,13,21,.62);overflow:visible}
.vsw{border-radius:15px 15px 0 0}
.bd,.gridwrap{background:transparent;border-radius:0 0 15px 15px}
.bd{min-height:60vh}
.rl{background:rgba(10,13,21,.5);border-left:1px solid rgba(255,255,255,.13);
 top:calc(var(--hh,0px) + 12px);
 max-height:calc(100vh - var(--hh,0px) - 24px);overflow-y:auto}
.rt{border-radius:15px 15px 0 0}
@media(max-width:900px){
 .gr{padding:8px;gap:8px}
 .rl{top:auto;max-height:none;border-radius:16px}
}

/* PHONE BOARD WIDTH — pre-existing bug, not caused by the glass work.
   The row grid's fixed columns plus the name's min-content came to ~446px,
   so on a 375px phone the whole board pushed the page into horizontal
   scroll. Grid items default to min-width:auto, so the name track refused
   to shrink. Tightening the fixed columns and letting the name ellipsis
   keeps everything on screen. */
@media(max-width:560px){
 .bd{padding:0 10px 40px}
 /* the "who took him" column is dropped: taken rows are hidden by default,
    and the Log and Rosters tabs both answer that question. Its 44px goes to
    the player name, which is the one thing you cannot afford to truncate. */
 .rw{grid-template-columns:26px 1fr 34px 34px 14px 38px 20px;gap:5px;padding:10px 4px}
 .tk2{display:none}
 .rw>*{min-width:0}
 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tr{padding:9px 10px}
 .tr em{display:none}          /* tier subtitle is the first thing to go */
}

/* modal: opaque enough to read, blurred edge to feel like glass */
.md{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mbx{background:rgba(20,26,38,.72);
 backdrop-filter:blur(40px) saturate(1.8);
 -webkit-backdrop-filter:blur(40px) saturate(1.8);
 border:1px solid rgba(255,255,255,.18);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 24px 70px rgba(0,0,0,.6)}

/* draft grid: sticky headers can't be see-through or the scroll shows
   right through the labels */
.dg th,.dg th:first-child,.dg td.rdnum{background:rgba(12,15,22,.95)}
.dg th{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dg th.meCol{background:var(--red)}

/* ---- spot fixes: rules that hardcoded light-board colors ---- */

/* QB TIMING — this league is NOT normal.

   Passing yards score 0.10/yd = 1 pt per 10 yards. Most leagues use 1 per 25.
   That's 2.5x, and it's why Andre has seen 70-point QB weeks. It inflates
   every quarterback's raw total.

   But every team starts exactly ONE QB, so raw points don't win games --
   the GAP between your QB and the other guy's does:

     Josh Allen        pick 36, $22  -> ~675 pts

   round 4 is defensible but expensive; waiting past pick 85 is a real mistake
   in THIS scoring system, even though it's correct advice in a normal league. */

   Andre's league is a public league. Public drafters do something the ESPN
   analysts don't: they REACH for name-brand quarterbacks and let the actually

     PUBLIC takes                 EXPERTS take        Points (Andre's scoring)
       Mahomes    pick 75           pick 130            557
       Herbert    pick 74           pick 130            512
       Dak        pick 62           pick 103            535
       ---------------------------------------------------------------
       Jayden Daniels pick 87       pick 58             611  <-- FALLS TO YOU
       Jalen Hurts    pick 95       pick 68             601  <-- FALLS TO YOU

   Daniels scores 54 MORE points than Mahomes and goes 12 picks LATER.
   That is the entire edge. Do not spend a 4th-rounder on Josh Allen when
   a near-equal QB is sitting there in round 9. */

/* ================= DRAFT MATH ================= */
const tAt  = n => { const r=Math.floor(n/NT), s=n%NT; return r%2===0 ? s : NT-1-s; };
const meI  = () => teams.findIndex(t=>t.isMe);
const TOT  = () => RD*NT;
const clk  = () => picks.length < TOT() ? tAt(picks.length) : -1;

function untl(){
 const m=meI();
 for(let n=picks.length;n<TOT();n++) if(tAt(n)===m) return n-picks.length;
 return -1;
}
function bef(){
 const m=meI(), o=[];
 for(let n=picks.length;n<TOT();n++){ if(tAt(n)===m) break; o.push(tAt(n)) }
 return o;
}
const ros = i => picks.filter(p=>p.team===i).map(p=>P.find(x=>x[0]===p.rank)).filter(Boolean);
function cnt(i){
 const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
 ros(i).forEach(p=>c[p[3]]++);
 return c;
}
const shy = (i,p) => Math.max(0, NEED[p] - cnt(i)[p]);
function lft(i){
 let n=0;
 for(let x=picks.length;x<TOT();x++) if(tAt(x)===i) n++;
 return n;
}
const tkn = r => picks.some(p=>p.rank===r);
const tkB = r => { const p=picks.find(x=>x.rank===r); return p ? p.team : -1; };
/* FREE AGENTS OFF THE BOARD. Tyreek Hill (cut by Miami in Feb '26, may not
   play at all this season), Stefon Diggs, Deebo Samuel -- the data marks them
   'FA' but nothing excluded them, so the app offered Tyreek in the pick modal.
   No team = not draftable. If one signs before Sept 4, say so and he goes back. */
for(let i=P.length-1;i>=0;i--) if(P[i][2]==='FA') P.splice(i,1);

const av  = () => P.filter(p=>!tkn(p[0]));

/* ===== LEGALITY ===== */
function slackFor(ti){
 const req = POS.reduce((s,p)=>s+shy(ti,p), 0);
 return lft(ti) - req;
}
/* Art's REQUIRED roster: QB3 RB4 WR6 TE2 K2 DEF2 = 19 players.
   The draft is 20 rounds. So ONE pick is a free flex — Art said "required to
   draft the following", which makes those MINIMUMS, not caps.

   (Found this the hard way: I'd coded them as hard caps, and once a team filled
   all 19 required slots it had a pick left with nothing legal to take. The
   draft crashed at pick 191.)

   So: you must fill every minimum, and your spare pick can go to any skill
   position. K and DEF stay capped — a third kicker is a wasted roster spot. */
/* Roster is 19 and Art's required list is EXACTLY 19 (QB3 RB4 WR6 TE2 K2
   DEF2). Every pick is spoken for -- there is no bonus pick, so the caps ARE
   the minimums. (The old "20th free pick" was a misread of the rules.) */
const CAP = { QB:3, RB:4, WR:6, TE:2, K:2, DST:2 };

function legal(ti, ps){
 const have = cnt(ti)[ps];

 /* never exceed the sane ceiling (and never a 3rd K or DEF) */
 if(have >= CAP[ps]) return false;

 /* still owed the minimum? always legal. */
 if(shy(ti,ps) > 0) return true;

 /* minimum already met — this would be a bonus pick. Only if I have a spare
    pick after covering everything I still owe, and only at a skill position. */
 if(slackFor(ti) <= 0) return false;
 return FLEX.includes(ps);
}
/* ===== EXPERT CONSENSUS =====
   p[7]  = FantasyPros ECR   (crowd of experts)
   p[10] = Field Yates PPR   (0 = he doesn't rank him at all)
   p[11] = BLEND            (what we actually trust)
   p[12] = SPLIT            (how much they disagree; + = Yates higher)
   A player both sources rank low is a strong signal. A player Yates
   won't rank AT ALL in his top 160 is the strongest signal there is. */
const Q  = p => p[11] || p[7] || 999;      // quality: 3-source blended rank
const YR = p => p[10];                      // Field Yates PPR rank (0 = unranked)
const ER = p => p[13];                      // ESPN 10-team PPR rank (0 = unranked)
const AU = p => p[14];                      // ESPN auction value

/* ===== HOW WE PROJECT 2026 =====

   Andre's call, and it's the right one: "use last year's points as a guideline
   to find shit -- you can even look at 2024."

   The problem with using last season alone: it drafts you a team of last year's
   guys. Jeremiyah Love projected to ZERO because he has no NFL snaps -- but the
   experts have him as a top-8 RB. Meanwhile Matthew Stafford scored the most
   points in this league last year (690) and the experts have him ranked QB15,
   because he's 38 and that season was a spike.

   SO HERE'S THE MODEL:

     WHO is good this year   -> the EXPERT BOARD. They watch camp, trades,
                                depth charts, injuries. That's forward-looking.

     HOW MANY POINTS he gets -> THE CURVE. We know from real 2025 results what
                                the Nth-best guy at each spot actually scores in
                                THIS league's scoring:
                                   RB1=417  RB10=254  RB20=208
                                   WR1=376  WR10=221  WR30=178
                                   QB1=690  QB10=534  QB20=406
                                   TE1=316  TE10=178  TE20=126
                                So "experts say he's RB8" becomes "about 290 pts."

     SANITY CHECK            -> his own last TWO seasons. A guy who scored big
                                two years running is real (Josh Allen: 39.9/gm
                                then 38.9/gm). A guy who spiked once is a coin
                                flip (Stafford: 29.4 -> 40.6). Two years of
                                history gets weighted 40%, one year gets 25%,
                                no history rides on the expert rank alone.

   That keeps the useful part of last year's data -- the SHAPE of the scoring,
   which is why RB/WR beat QB in this league -- without drafting last year's
   team.

   ===== the fields =====                                                    */
const PROJ = p => p[16] || 0;   // projected 2026 points, Andre's scoring
const Y25  = p => p[17] || 0;   // what he actually scored in 2025
const Y24  = p => p[18] || 0;   // ...and 2024
const GP   = p => p[19] || 0;   // games played in 2025
const PRK  = p => p[20] || 99;  // his rank at his position per the experts
const Y23  = p => p[21] || 0;   // ...and 2023
const YRS  = p => p[22] || 0;   // how many seasons of history he has
const SWING= p => p[23] || 0;   // best year minus worst year, per game

/* ===== WHAT 3 YEARS TELLS YOU THAT 2 CAN'T =====
   Andre asked for 2023 too, and he was right — some things only show up
   across three seasons:

     Justin Jefferson  20.3 -> 18.8 -> 11.9 per game.  THREE straight years of
                       decline. Two years of data reads this as a bad season.
                       Three years reads it as a trend.

     Jaxon Smith-Njigba 8.8 -> 15.0 -> 21.2.  A real climb, not a fluke year.

     Josh Allen        41.3, 39.9, 38.9.  Swing of 2.4 across three seasons.
                       That's not a good player, that's a metronome.

   HOW THE PROJECTION USES IT:
     - Recent years count more: 2025 x3, 2024 x2, 2023 x1
     - CONSISTENCY EARNS TRUST. A guy with 3 steady years (swing <= 3.5/gm) gets
       55% of his projection from his OWN record. A bouncy guy or a one-year
       wonder leans on the expert board instead, because his own numbers aren't
       predicting anything.
     - No history at all (rookie) = 100% expert board.                        */

/* is he a guy you can set and forget? */
const SOLID = p => YRS(p) >= 3 && SWING(p) <= 3.5;
/* or is his own record telling you nothing? */
const BOUNCY = p => YRS(p) >= 2 && SWING(p) >= 8;

/* ===== WHY RB/WR BEAT QB IN THIS LEAGUE (still true, still matters) =====
   Real 2025 results, scored in Andre's rules:
     RB1 (McCaffrey 417) beat RB20 by 209 pts  -- a 50% cliff
     WR1 (Nacua 376)     beat WR30 by 198 pts  -- a 53% cliff
     TE1 (McBride 316)   beat TE10 by 138 pts  -- a 44% cliff
     QB1 (Stafford 690)  beat QB10 by 156 pts  -- only a 23% cliff

   The 2.5x passing-yard rule lifts EVERY quarterback, so QB1 through QB12 all
   landed between 528 and 690. No edge to win there -- they're all good. RB and
   WR fall off a cliff, and you start 2 RB + 3 WR + a flex versus only 1 QB.
   That's a fact about the SCORING SYSTEM, not about last year's players, so it
   carries forward to 2026 regardless of who's on the field. */

/* replacement level = the last guy who'd ever start in a 10-team league */
/* Replacement = the last guy who'd ever start. With 2 WR + a flex, the
   league starts ~10 QB, ~24 RB, ~25 WR, ~11 TE (flexes split RB/WR-heavy).
   From real 2025 results in this scoring:
     QB10 534 | RB24 182 | WR25 188 | TE11 176
   Note what the flex change did: WR replacement went UP (fewer start), RB
   went DOWN (flexes lean RB). Receivers are worth a bit less now, backs a
   bit more. */
const REPL = { QB:534, RB:182, WR:188, TE:176, K:120, DST:90 };

/* VOR: how many points he beats a replacement starter by. THE number that wins
   games -- a 690-pt QB only helps you by however much he beats the QB10 that
   everyone else can just have for free. Now built on the PROJECTION, not on
   last year's box score. */
const VOR = p => PROJ(p) - (REPL[p[3]] || 100);

/* did he miss real time in 2025? (used to caveat the display, not the math --
   the projection already accounts for it) */
const HURT = p => GP(p) > 0 && GP(p) <= 12;
const PG   = p => GP(p) ? Y25(p)/GP(p) : 0;   // his 2025 per-game
const PACE = p => Math.round(PG(p) * 17);     // ...over a full season

/* LY is what the older display code calls -- point it at the projection */
const LY = p => PROJ(p);

/* ===== TIGHT END: ANDRE'S RULE =====
   His words: "fuck tight ends, treat them all the same."
   2025 actuals back him up almost entirely:
       TE2  Kyle Pitts      211
       TE5  Tyler Warren    188
       TE9  Hunter Henry    179
       TE12 Colston Loveland 165
   TE2 through TE12 = 46 points apart. That's 2.7/week. Nothing.
   Reaching for a TE in round 2 buys you nothing you can't get in round 12.

   THE ONE EXCEPTION:
       TE1  Trey McBride    316   <-- beat TE2 by 105 pts (6.2/week)
   That's the biggest single-player gap at ANY position on the board.
   So we flatten the whole position EXCEPT him. If McBride is there and the
   value's right, take him. Every other TE waits until the late rounds. */
const ELITE_TE = p => p[3]==='TE' && LY(p) >= 280;   // McBride, and only him
const FLAT_TE  = p => p[3]==='TE' && !ELITE_TE(p);   // everybody else
const SRC= p => p[15];                      // how many sources rank him (0-3)

/* ===== TRAP CHECK — a player who is simply bad value =====
   ADP is meaningless for K/DST, so they're exempt. For skill
   players, a big negative val means the market overrates him and
   the experts don't. Never draft one. This applies to the BOT
   and to YOU — same rule, one place. */
/* The board is now ESPN's ACTUAL 10-team PPR draft order, so `val` finally
   measures something real: how far past his worth the room is reaching.
   In a 10-team league, 14 picks is a full round and a half. */
/* Trap = the public drafts him 30+ picks earlier than experts rank him.
   Was -14, which flagged 36 players including Burrow, Higgins, Mahomes --
   guys who are slightly overhyped, not dangerous. Andre reviewed the list:
   only the extreme gaps are real traps (Darnold -43, Herbert -42, Mahomes -41,
   Kraft -37, Dak -36). -30 keeps those and drops the noise. */
const TRAP_LIMIT = -30;
function isTrap(p){
 if(p[3]==='K' || p[3]==='DST') return false;    // ADP is noise for kickers

 /* TRAPS EXPIRE. The flag means "the public takes him way earlier than the
    experts think he's worth" -- a warning about OVERPAYING. Once the draft
    passes his expert rank, he's fairly priced or a bargain, and blocking him
    is refusing free value. Mahomes is a trap at pick 75 (experts say 116);
    at pick 130 he's the best QB2 on the board. */
 const pkNow = picks.length + 1;
 const ecr = p[7] || 999;
 if(pkNow > ecr) return false;                   // past his fair price: not a trap

 if(p[9] <= TRAP_LIMIT) return true;
 /* no expert ranks him anywhere, yet the room takes him inside the top 120 */
 if(SRC(p) === 0 && p[5] <= 120) return true;
 return false;
}
/* is there a better option at the same position right now? */
function betterAt(ti, ps, worseThan){
 return av().filter(x => x[3]===ps && !isTrap(x) && legal(ti,x[3]))
            .sort((a,b)=>PROJ(b)-PROJ(a))[0] || null;
}

function blockReason(ti, ps){
 const sl=slackFor(ti), pl=lft(ti);
 const owed = POS.filter(p=>shy(ti,p)>0)
   .map(p=>`${shy(ti,p)} ${p==='DST'?'DEF':p}`);
 if(sl<=0 && owed.length)
  return `You have ${pl} pick${pl===1?'':'s'} left and still owe ${owed.join(', ')}. Every remaining pick is required.`;
 if(!FLEX.includes(ps))
  return `You're already full at ${ps==='DST'?'DEF':ps}. Extras can't go in the flex.`;
 return `No roster room.`;
}

/* ============================================================
   TRAIT ENGINE

   Not nine labels — a continuous space. Every bot is rolled from
   independent dials, so you get hybrids: a value-hunting zero-RB
   guy who panics at QB, a name-chasing TE fiend who's disciplined
   about kickers. Same room never happens twice.

   Traits also DRIFT mid-draft: a bot that misses its target
   position gets antsy and starts reaching. Real people do this.
   ============================================================ */

/* pull a value from a range */
const roll = (lo,hi)=> lo + Math.random()*(hi-lo);
const pick1 = arr => arr[Math.floor(Math.random()*arr.length)];

function makeBrain(){
 /* ---- POSITIONAL APPETITE: how much this manager loves each spot ----
    Correlated, not independent: someone who loves RB usually cools on WR.
    We roll an "RB/WR axis" then jitter everything around it. */
 const axis = roll(-1,1);                    // -1 = zero-RB, +1 = RB hoarder
 const rbLove = axis*52 + roll(-12,12);
 const wrLove = -axis*44 + roll(-12,12);

 /* TE: only a minority truly covet one. Most are indifferent.
    Skewed roll — mostly small, occasionally strong. */
 const teLove = (Math.random() < 0.25) ? roll(8, 22) : roll(-24, 4);

 /* How hard does this manager chase the TE WINDOW (the top-7 cliff)?
    Most rooms have 2-3 guys who know the cliff is real and seven who
    don't think about it. 0 = never reaches, 1 = sprints for it.
    If EVERY bot chased it, Bowers would go 4th overall — which is not
    how a real draft goes. */
 const teWindow = (Math.random() < 0.2) ? roll(0.5, 0.9) : roll(0, 0.12);
 /* QB appetite is expressed through qbFloor, not a big score bonus —
    otherwise QBs get pulled into round 1. Keep this small. */
 const qbLove = roll(-10, 14);

 /* ---- TEMPERAMENT ---- */
 const b = {
  /* how early they'll take a QB. Wide spread — some panic, some wait forever */
  /* earliest a real manager takes a QB in this league is round 4-5; the
     patient ones wait until round 9+. (Was roll(26,95) -- 26 is round 3.) */
  qbFloor: Math.round(roll(38, 100)),

  /* how hard they chase ADP bargains vs. just taking the best name */
  valueMult: roll(0.4, 2.8),

  /* how much they lean on raw board position (reputation drafting) */
  adpMult: roll(0.85, 1.35),

  /* do they understand PPR? some don't. */
  pprIQ: roll(0.2, 1.9),

  /* how badly they avoid faders/busts */
  fadePenalty: roll(0.7, 2.2),

  /* how much they reach for need vs. take BPA */
  needBias: roll(0, 34),

  /* how much randomness — the "he just likes the guy" factor */
  noise: roll(4, 26),

  /* do they hoard a position past requirement? */
  stackBias: roll(-26, 12),

  /* how early they panic-draft K/DEF */
  kdEarly: roll(0, 1) < 0.22,

  /* how hard they chase the top-7 TE cliff (0 = ignores it, 1 = sprints) */
  teWindow,

  bias: {
   RB: rbLove,
   WR: wrLove,
   TE: teLove,
   QB: qbLove,
   K: 0, DST: 0
  }
 };

 /* ---- a name for the rail, derived from the dials ---- */
 const tags=[];
 if(b.bias.RB > 24) tags.push('RB-heavy');
 if(b.bias.RB < -18) tags.push('Zero-RB');
 if(b.bias.WR > 24) tags.push('WR-heavy');
 if(b.bias.TE > 30) tags.push('TE-hungry');
 if(b.qbFloor < 45) tags.push('early-QB');
 if(b.qbFloor > 78) tags.push('QB-last');
 if(b.valueMult > 2.0) tags.push('bargain hunter');
 if(b.adpMult > 1.2) tags.push('name chaser');
 if(b.pprIQ < 0.6) tags.push('ignores PPR');
 if(b.noise > 20) tags.push('unpredictable');
 if(b.kdEarly) tags.push('early K/DEF');
 b.name = tags.length ? tags.slice(0,2).join(' · ') : 'Balanced';
 b.tags = tags;
 return b;
}

let personas=[];
function assignPersonas(){
 personas=[];
 for(let i=0;i<NT;i++){
  personas[i] = (teams[i] && teams[i].isMe) ? null : makeBrain();
 }
}

/* ---- DRIFT: bots get antsy if the board isn't going their way ---- */
function drift(ti){
 const b=personas[ti];
 if(!b) return b;
 const pick=picks.length+1;
 const c=cnt(ti);
 const d={...b, bias:{...b.bias}};

 /* If they're behind on their favorite position, they press harder. */
 const fav = Object.entries(b.bias).sort((a,x)=>x[1]-a[1])[0];
 if(fav && fav[1]>20 && shy(ti,fav[0])>0){
  const behind = shy(ti,fav[0]) / NEED[fav[0]];
  d.bias[fav[0]] += behind * 28;               // press
 }
 /* Late in the draft everyone gets need-driven. */
 if(pick > 120) d.needBias = b.needBias + 22;
 /* QB panic: only late, and only when the STARTERS are genuinely drying up.
    (This used to fire on PICK 1 -- it counted startable QBs, and a 10-team
    league only has ~10-12 of those, so the "pool is thin" test was true before
    anyone had picked. Every bot's floor collapsed instantly and all six took a
    QB with the first six picks of the draft.) */
 if(c.QB===0 && pick >= 40){
  const qbLeft = av().filter(p=>p[3]==='QB' && isStartable(p)).length;
  const qbNeeders = teams.filter((t,i)=>cnt(i).QB===0).length;
  /* real panic = fewer startable QBs left than teams who still need one */
  if(qbLeft <= qbNeeders) d.qbFloor = Math.min(d.qbFloor, pick);
 }
 return d;
}

function suggest(ti){
 const pool = av().filter(p => legal(ti, p[3]));
 if(!pool.length) return null;

 /* YOU get the clean brain. Bots get their quirks. */
 const isMe   = teams[ti] && teams[ti].isMe;
 const b      = isMe ? null : drift(ti);

 const bias   = b ? b.bias : {};
 const vMult  = b ? b.valueMult : 1;
 const aMult  = b ? b.adpMult : 1;
 const pprIQ  = b ? b.pprIQ : 1;
 const fPen   = b ? b.fadePenalty : 1;
 /* YOU always play the window correctly. Bots vary. */
 const teWin  = b ? b.teWindow : 1;
 const nBias  = b ? b.needBias : 14;
 const noise  = b ? b.noise : 0;
 const stack  = b ? b.stackBias : -18;
 const qbFlr  = b ? b.qbFloor : QB_FLOOR;
 const kdEarly= b ? b.kdEarly : false;

 const pl    = lft(ti);
 const req   = POS.reduce((s,p)=>s+shy(ti,p),0);
 const slack = pl - req;
 const pick  = picks.length + 1;

 /* TRULY LOCKED: no choice left at all — every remaining pick must go to a
    position I still owe, and there's only one such position.

    This used to fire whenever slack <= 0. Under the final rules the roster (19)
    equals the required list (19), so slack is ALWAYS zero and this shortcut ran
    on EVERY pick of EVERY bot's draft — skipping the QB floor, scarcity, need,
    all of it. And it picked by RAW PROJECTION, which means a 681-point QB beats
    a 386-point RB every time. That's why all six bots opened the draft with
    quarterbacks.

    Now it only fires when there's genuinely nothing to decide, and it ranks by
    VALUE OVER REPLACEMENT so it can't get seduced by a big QB number. */
 const owedPositions = POS.filter(q => shy(ti,q) > 0);
 if(owedPositions.length === 1 && lft(ti) <= shy(ti, owedPositions[0])){
  const ps = owedPositions[0];
  let from = pool.filter(p => p[3] === ps);
  const clean = from.filter(p => !isTrap(p));
  if(clean.length) from = clean;
  if(from.length) return from.reduce((a,x)=> PROJ(x) > PROJ(a) ? x : a);
 }

 let gap=0;
 for(let n=picks.length+1;n<TOT();n++){ if(tAt(n)===ti)break; gap++ }
 const skillOwed = shy(ti,'RB')+shy(ti,'WR')+shy(ti,'TE')+shy(ti,'QB');

 const score=p=>{
  const[rk,nm,tm,ps,adp,padp,f,ecr,by,val,yat,blend,split]=p;
  /* Board position drives everything. Early on, the room drafts close to
    the sheet; later, personal preference takes over. */
 const chalk = picks.length < 15 ? 1 : aMult;
 let s = -padp * chalk;

  /* POINTS AWARENESS. The bots used to draft on board position alone and got
     out-pointed at every premium slot (QB +27, RB1 +56, RB2 +24 for the app).
     Real managers can read a projection. Give them credit for how much a guy
     beats a REPLACEMENT at his spot -- weaker than the app's 0.42 weight, so
     they're good-but-human, not ten clones of the engine. */
  if(ps!=='K' && ps!=='DST') s += VOR(p) * 0.36;

  if(ps==='QB' && pick < qbFlr) return -1e9;
  if(ps==='K'||ps==='DST'){
   /* most wait; the impatient ones jump a few rounds early.
      (same slack-is-always-zero fix as the engine) */
   const earliest = kdEarly ? 118 : 145;
   const kdOwed = shy(ti,'K') + shy(ti,'DST');
   const spare  = lft(ti) - kdOwed;
   if(skillOwed > 0 && spare >= skillOwed && pick < earliest) return -1e9;
  }
  if(isTrap(p)) return -1e9;
  /* Yates ranks the top 160 in PPR. If a guy is being drafted inside that
     window and Yates won't rank him at all, the market is ahead of itself. */
  if(!yat && padp <= 150 && ps!=='K' && ps!=='DST') s -= 30;
  /* both experts agree he's good -> bump */
  if(yat && Math.abs(split) <= 12) s += 6;

  if(ps!=='K' && ps!=='DST'){
   s += Math.max(-30, Math.min(val, 20)) * 0.55 * vMult;
  }

  /* PPR ADJUSTMENT — small, because the board is ALREADY a PPR board.
     ESPN's cheat sheet is their PPR cheat sheet; Yates' list is his PPR
     list. The catches are already priced in. This flag is only a nudge for
     guys the market hasn't fully caught up on — it is NOT a second helping
     of PPR credit.

     It used to be worth up to 41 points in round 1, which was enough to
     push the consensus #1 overall (Gibbs) down to pick 11 behind lower-
     ranked "PPR risers". That's not a real draft. */
  const early = pick <= 60 ? 1.0 : (pick <= 120 ? 0.8 : 0.5);
  const pprTerm = f * 4 * early * pprIQ;
  s += (f < 0) ? pprTerm * fPen : pprTerm;

  /* TE reality: even Bowers/McBride are ~pick 20 in PPR, not top-10.
     Hard damp on any TE inside the first 14 picks. */
  /* TE on ESPN's 10-team PPR board:
       McBride 16 · Bowers 24  ||  Loveland 49 · Warren 50  ||  Pitts/Fannin/LaPorta 71-73
       ...then a WALL. Kittle at 101 is TE8, and it's bench guys after.
     Don't reach in round 1 — but don't sleep through the window either. */
  if(ps === 'TE' && FLAT_TE(p)){
   /* the room shouldn't be reaching for interchangeable TEs either */
   if(pick <= 55) s -= 70;
  }
  if(ps === 'TE'){
   if(padp < 14) s -= 90;                        // never a top-13 pick
   else if(padp < 22) s -= 20;                   // McBride late-1st is defensible

   /* The TE window matters — but NOT every manager chases it. A real room
      has a couple of guys who covet an elite TE and seven who shrug and
      wait. `teLove` is rolled per-manager in makeBrain(), so only the
      TE-hungry bots sprint for the window. Giving ALL of them the boost
      makes Bowers go 4th overall, which is not a real draft. */
   if(shy(ti,'TE') > 0 && padp <= 75) s += 18 * teWin;
  }

  s += (bias[ps] || 0);

  if(shy(ti,ps) > 0){
   /* NEED is real, but it isn't urgent until the position is actually thin.
      Every manager "needs" 2 TEs from pick 1 — that doesn't mean pick 1 is
      the time to take one. Scale need-urgency by how many roster spots are
      left vs. how much you still owe. Early on, need should barely register. */
   const urgency = Math.min(1, (req + 2) / Math.max(1, pl));
   s += nBias * urgency;
   if(slack === 1) s += 30;
   if(gap > 0){
    const surv = pool.filter(x => x[3]===ps && x[5] > padp && x[5] <= padp+gap).length;
    if(surv === 0) s += 20;
   }
  } else {
   /* Minimum already met at this spot. A bonus body here is worth something
      (bye weeks, injuries, flex) but it is worth FAR LESS than a starter you
      still don't have. This is where the bots used to break: they'd get a
      stacking BONUS and take six straight receivers, then start a 134-pt RB.
      Kill the value of anyone past the starting slots. */
   const have = cnt(ti)[ps];
   const startsHere = STARTERS[ps] || 1;
   if(have >= startsHere + 1){
    s -= 90;                     // deep bench body: almost worthless
   } else if(have >= startsHere){
    s -= 35;                     // first backup: some value, not much
   }
   s += stack * 0.35;            // stacking still counts, but way less
  }

  /* HARD BRAKE: never take a 4th of anything while a STARTING spot is empty.
     If I have no TE and I'm eyeing my 5th receiver, that's a broken draft. */
  {
   const c = cnt(ti);
   const missingStarter =
     (c.QB < 1) || (c.RB < 2) || (c.WR < 3) || (c.TE < 1);
   const haveHere = c[ps];
   const startsHere = STARTERS[ps] || 1;
   if(missingStarter && haveHere >= startsHere + 1) s -= 200;
  }

  if(ps === 'QB'){
   const have = cnt(ti).QB;
   /* In THIS league the passing rules make QBs score 500-690 -- far more than
      any skill guy. Real managers in Andre's room notice that and take one in
      the middle rounds. The bots used to punt QB entirely and start a 565-pt
      backup while the app had a 681-pt starter, which made the app look better
      than it is. Give the bots a realistic QB clock. */
   if(have === 0){
    const pk = picks.length + 1;
    if(pk >= 45 && pk <= 90) s += 55;    // the window a real manager uses
    if(pk > 90) s += 110;                // now they're panicking, correctly
   }
   /* Expert mocks: backup QBs go at 130+ (Mahomes 130, Herbert 130,
      Stafford 133, Murray 155). You START ONE. A QB2 is bye insurance;
      a QB3 is the last pick of the draft. My bots were taking Mahomes
      at pick 83 -- 47 picks too early. */
   if(have >= 1) s -= 160;
   if(have >= 2) s -= 280;
   /* still QB-less and we're in the window -- this is the moment */
   if(have === 0){
    const pk = picks.length + 1;
    if(pk >= QB_SWEET_LO && pk <= QB_SWEET_HI) s += 30;
    if(pk > QB_SWEET_HI) s += 55;      // now you're late; grab one
   }
  }

  /* BYE WEEKS — a small nudge, not a rule.
     If you already have 2+ starters on this bye, prefer someone else. */
  if(by && ['RB','WR','TE','QB'].includes(ps)){
   const same = ros(ti).filter(x => x[8]===by && ['RB','WR','TE','QB'].includes(x[3])).length;
   if(same >= 2) s -= 10;
   if(same >= 3) s -= 22;
  }

  /* the human factor */
  /* NOISE — but not at the top of the draft.
     Nobody in a real room passes on the consensus #1 overall because they
     had a hunch. Round 1 is close to chalk: everyone takes the best guy.
     By round 8 people are guessing, reaching for their favorites, and
     drafting on vibes. So noise should START near zero and GROW. */
  if(noise){
   const early = Math.min(1, picks.length / 45);   // 0 at pick 1 -> 1 by pick 45
   s += (Math.random()-0.5) * noise * early;
  }

  return s;
 };

 let best=null, bs=-1e18;
 for(const p of pool){ const s=score(p); if(s>bs){bs=s; best=p} }
 if(!best || !legal(ti, best[3])){
  const must = pool.filter(p => shy(ti, p[3]) > 0);
  /* rank by VALUE OVER REPLACEMENT, not raw points -- raw points always crowns
     a QB (600+) over an elite RB (390), which is how the round-1 QB stampede
     happened in the first place */
  best = must.length
    ? must.reduce((a,x)=> VOR(x) > VOR(a) ? x : a)
    : pool[0];
 }
 return best;
}

/* ============================================================
   THE COST-OF-WAITING ENGINE

   Quality doesn't fall off a cliff — it bleeds. So don't hunt for
   cliffs. Instead answer the only question that matters:

     "If I keep deferring this position, WHO do I actually end up
      starting?"

   For each position you still owe N of, look at your remaining picks
   and project the Nth-best guy who survives to each one. That is the
   player who lands in your lineup. Show it. That's the whole warning.
   ============================================================ */
function myPicks(ti){
 const out=[];
 for(let n=picks.length;n<TOT();n++) if(tAt(n)===ti) out.push(n);
 return out;
}
/* who survives to pick #n (0-based) */
function survivorsAt(ps, n){
 return av().filter(p => p[3]===ps && p[5] > n+1)
            .sort((a,b)=>PROJ(b)-PROJ(a));
}

/* THE PROJECTION: if you fill position ps with your LAST available picks,
   who ends up on your roster? Returns the worst starter you'd be forced into. */
function projectIfDeferred(ti, ps){
 const need = shy(ti,ps);
 if(need<=0) return null;
 const mine = myPicks(ti);
 if(mine.length < need) return null;

 /* deferring = you use your LAST `need` picks on this position */
 const late = mine.slice(-need);
 const got = [];
 const used = new Set();
 for(const n of late){
  const surv = survivorsAt(ps,n).filter(p=>!used.has(p[0]));
  if(surv[0]){ got.push(surv[0]); used.add(surv[0][0]); }
 }

 /* taking it NOW = you use your NEXT `need` picks */
 const soon = mine.slice(0, need);
 const gotNow = [];
 const usedNow = new Set();
 for(const n of soon){
  const surv = survivorsAt(ps,n).filter(p=>!usedNow.has(p[0]));
  if(surv[0]){ gotNow.push(surv[0]); usedNow.add(surv[0][0]); }
 }

 if(!got.length || !gotNow.length) return null;

 const avg = arr => arr.reduce((s,p)=>s+PROJ(p),0)/arr.length;
 return {
  need,
  ifNow:      gotNow,
  ifDeferred: got,
  costRanks:  Math.round(avg(got) - avg(gotNow)),   // how much worse
  worstNow:   gotNow[gotNow.length-1],
  worstLate:  got[got.length-1]
 };
}

/* the alerts you see BEFORE you pick.
   ONE at a time — the most urgent. Nagging gets ignored. */
function deadlineAlerts(ti){
 const out=[];
 const mine = myPicks(ti);
 if(mine.length < 2) return out;
 const pick = picks.length+1;

 const scored = [];
 POS.forEach(ps=>{
  if(shy(ti,ps)<=0) return;
  if(ps==='K'||ps==='DST') return;
  /* QB: don't nag before the floor — we WANT you to wait that long.
     Start warning only once the good ones are actually draining. */
  if(ps==='QB' && pick < QB_FLOOR) return;
  const pr = projectIfDeferred(ti, ps);
  if(!pr) return;

  /* urgency = how much it costs, scaled by how soon you must act.
     A position with few picks left is more urgent than a costly-but-early one. */
  const slack = mine.length - POS.reduce((s,q)=>s+shy(ti,q),0);
  /* slack is permanently 0 now (roster == required list), so the old
     "slack<=2 doubles urgency" fired on every pick of every draft */
  scored.push({ps, pr, urgency: pr.costRanks});
 });

 scored.sort((a,b)=>b.urgency - a.urgency);

 /* GATES (added after this banner told Andre to take TWO tight ends at
    PICK THREE of round one):
    - no drift lectures in the first ~4 rounds. The board is deep, bestPick is
      already steering, and the deferral math compares "now" against your LAST
      picks -- a strawman that makes everything look urgent early.
    - never for TE before pick 55: Andre's rule, TEs are interchangeable. The
      engine already grabs McBride when he's the play.
    - never for QB before its window (~45): the QB tier is FLAT in this
      scoring; there is no tier to lose. */
 const pkNow = picks.length + 1;
 if(pkNow < 45) return out;
 const gated = scored.filter(x =>
   !(x.ps==='TE' && pkNow < 55) &&
   !(x.ps==='QB' && pkNow < 45));

 /* only the single most urgent, and only if it genuinely matters */
 const top = gated[0];
 if(!top || top.pr.costRanks < 30) return out;

 const {ps,pr} = top;
 const label = ps==='DST'?'DEF':ps;
 /* REPORT, don't command. This banner used to name a player and say "take him"
    -- which had it telling Andre to grab a RB while The Pick recommended a TE.
    Only The Pick recommends. This just tells him the position is thinning. */
 out.push(`<div class="cd dl">
   <b>${label} is thinning out.</b>
   The longer you wait, the bigger the drop-off at that spot.
   The Pick accounts for this.</div>`);
 return out;
}

/* ============================================================
   LIVE SCARCITY ENGINE

   Reads the ACTUAL board, not a model. Every pick, it recomputes:

     supply  = quality players left at each position
     demand  = how many the other 9 teams are still REQUIRED to take
     pressure = demand / supply

   High pressure = that position is about to get raided. Take yours.
   Low pressure  = nobody's coming for it. You can wait.

   This is what tells you to pivot when the room overdrafts RBs.
   ============================================================ */

/* "startable" = good enough to actually put in a lineup.
   Cutoff scales by position: there are more usable WRs than TEs. */
/* THE STARTER LINE — who actually plays on Sunday.
   10 teams, lineup 1QB 2RB 3WR 1TE 1FLEX 1K 1DEF. Leaguewide that means
   ~10 QBs, ~20 RBs, ~30 WRs, ~10 TEs start every week, plus 10 flex spots
   that mostly go RB/WR. Round up a little for injuries and bye fills.

   These are blended-rank cutoffs, and they are the whole point: a WR ranked
   50th is NOT a starter in this league, he's a bench body. Counting him as
   "startable" is how you end up with a WR50 in your flex and no warning. */
/* "Startable" used to be a RANK cutoff (Q(p) <= 70), and different parts of the
   app read it at different times and disagreed -- the alert claimed 6 startable
   WRs while The Pick saw 1, and it said "0 startable RB" with a 185-point back
   on the board. A player is startable if he BEATS A REPLACEMENT. That's points,
   and it gives the same answer everywhere. (REPL is defined up top from real
   2025 results: QB 534 | RB 182 | WR 188 | TE 176.) */
const isStartable = p => PROJ(p) >= (REPL[p[3]] || 0) - 12;   // small cushion
const STARTABLE = {QB:90, RB:70, WR:78, TE:78, K:999, DST:999};  // legacy, unused

function supply(ps){
 return av().filter(p=>p[3]===ps && !isTrap(p) && isStartable(p)).length;
}
/* how many of this position the OTHER teams still must draft */
function demandFrom(others, ps){
 return others.reduce((s,i)=>s+shy(i,ps),0);
}
/* who picks between now and my next turn */
function upcoming(ti){
 const out=[];
 for(let n=picks.length;n<TOT();n++){
  if(tAt(n)===ti) break;
  out.push(tAt(n));
 }
 return out;
}

function scarcity(ti){
 /* Look ahead a FULL ROUND of picks, not just to my next turn.
    Otherwise the window is too small to see a raid coming. */
 const soon = upcoming(ti);
 const window = Math.max(soon.length, NT);         // at least one round
 const others = [];
 for(let n=picks.length; n<Math.min(TOT(), picks.length+window); n++){
  const t = tAt(n);
  if(t !== ti) others.push(t);
 }
 const rows=[];
 POS.forEach(ps=>{
  if(ps==='K'||ps==='DST') return;
  const sup = supply(ps);

  /* DEMAND: how many of this position will realistically be taken in the
     window. A team takes it if they still need it. Cap by their pick count. */
  const bySeat = {};
  others.forEach(t=>{ bySeat[t]=(bySeat[t]||0)+1 });
  let dmd = 0;
  Object.entries(bySeat).forEach(([t,n])=>{
   dmd += Math.min(shy(+t, ps), n);
  });

  const pressure = sup>0 ? dmd/sup : 99;
  rows.push({
   ps, sup, dmd,
   pressure,
   mine: shy(ti,ps),
   best: av().filter(p=>p[3]===ps).sort((a,b)=>(a[7]||999)-(b[7]||999))[0]
  });
 });
 rows.sort((a,b)=>b.pressure-a.pressure);
 return rows;
}

/* THE EDGE: where is the room WRONG right now?
   If everyone's hoarding RB, WR gets cheap. Say so. */
function findEdge(ti){
 const rows = scarcity(ti);
 const iNeed = rows.filter(r=>r.mine>0);
 if(!iNeed.length) return null;

 const hot  = iNeed[0];
 /* THE OPPORTUNITY: a position I need where supply is deep AND pressure is low.
    Weight by how many I still need — a 5-WR hole is a bigger opportunity
    than a 1-TE hole. */
 const opps = iNeed
   .filter(r => r.sup >= 6)
   .map(r => ({...r, opp: (r.mine * r.sup) / Math.max(0.15, r.pressure) }))
   .sort((a,b)=> b.opp - a.opp);
 const cold = opps[0] || iNeed[iNeed.length-1];

 /* what did the room just do? last 10 picks by position */
 const recent = picks.slice(-10).map(p=>P.find(x=>x[0]===p.rank)[3]);
 const cnt10 = {};
 recent.forEach(p=>cnt10[p]=(cnt10[p]||0)+1);
 const raided = Object.entries(cnt10).sort((a,b)=>b[1]-a[1])[0];

 return { hot, cold, raided, rows };
}



/* ================= AUTO-DRAFT ================= */
/* Picks for whoever is on the clock, using that team's own brain. */
function autoPick(){
 const o = clk();
 if(o < 0) return false;
 const p = suggest(o);
 if(!p) return false;
 picks.push({rank:p[0], team:o});
 return true;
}
/* Run the bots forward until it's YOUR pick (or the draft ends). */
function runAuto(){
 let guard = 0;
 while(auto && clk() >= 0 && clk() !== meI() && guard++ < 260){
  if(!autoPick()) break;
 }
 pt();
}
/* Draft the whole thing out, including your picks. Handy for mocking. */
function autoAll(){
 let guard = 0;
 while(clk() >= 0 && guard++ < 260){
  if(!autoPick()) break;
 }
 pt();
}

/* ============================================================
   PLAYOUT SIMULATOR — play the rest of the draft out
   ============================================================ */
function simulate(rank, ti){
 const save = picks.slice();
 picks.push({rank:rank, team:ti});
 let guard=0;
 while(picks.length < TOT() && guard++ < 260){
  const o = tAt(picks.length);
  const p = suggest(o);
  if(!p) break;
  picks.push({rank:p[0], team:o});
 }
 const mine = picks.filter(x=>x.team===ti).map(x=>P.find(y=>y[0]===x.rank)).filter(Boolean);
 const byPos = {QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
 mine.forEach(p=>byPos[p[3]].push(p));
 POS.forEach(q=>byPos[q].sort((a,b)=>PROJ(b)-PROJ(a)));

 /* sort each position by PROJECTED POINTS, not by ranking */
 POS.forEach(q=>byPos[q].sort((a,b)=>PROJ(b)-PROJ(a)));

 const starters=[];
 const take=(q,n)=>{ for(let i=0;i<n && i<byPos[q].length;i++) starters.push(byPos[q][i]) };
 take('QB',1); take('RB',2); take('WR',2); take('TE',1); take('K',1); take('DST',1);
 const used=new Set(starters.map(p=>p[0]));
 /* flex = best remaining RB/WR/TE by POINTS */
 const flexPool=[...byPos.RB.slice(2), ...byPos.WR.slice(2), ...byPos.TE.slice(1)]
   .filter(p=>!used.has(p[0])).sort((a,b)=>PROJ(b)-PROJ(a));
 if(flexPool[0]) starters.push(flexPool[0]);

 /* THE FIX: this used to be `220 - his ranking` — a made-up number with no
    connection to points. So this modal would tell Andre "take Gibbs" and then
    show him McBride winning by 97, because the recommendation came from the
    real projections and this panel came from the fake formula. The app was
    arguing with itself. Now everything scores the same way: real points. */
 const strength = starters.reduce((s,p)=>s+PROJ(p),0);
 const risers = starters.filter(p=>p[6]===1).length;
 const faders = starters.filter(p=>p[6]===-1).length;

 picks = save;
 return { strength:Math.round(strength), starters, byPos, risers, faders,
  qb:byPos.QB[0], rb1:byPos.RB[0], rb2:byPos.RB[1],
  wr1:byPos.WR[0], wr2:byPos.WR[1], wr3:byPos.WR[2], te:byPos.TE[0] };
}

/* THE BUG ANDRE CAUGHT:
   He tapped Gibbs and the modal showed McBride finishing 97 points HIGHER --
   while the app was still telling him to take Gibbs. The app arguing with
   itself, in front of him, on draft night.

   WHY: this panel used to pick its own three alternatives at random (first
   available at each position) and score them with a made-up formula
   ("220 minus his ranking"). It had no idea what the app actually recommended.

   THE FIX: the modal now ALWAYS shows the app's own recommendation as one of
   the options, and scores everything in real projected points. So if Andre taps
   a guy the app doesn't like, he sees exactly that -- and sees what it would
   cost him. If he taps the recommended guy, it's the top line. Same brain
   either way. */
function playouts(rank, ti){
 const target = P.find(p=>p[0]===rank);
 const opts = [{p:target, label:'YOUR PICK'}];
 const seen = new Set([target[3]]);

 /* ALWAYS include what the app actually recommends — that's the comparison
    Andre cares about: "what does this cost me vs the pick you told me to make" */
 const rec = bestPick(ti);
 if(rec && rec.top.now && rec.top.now[0] !== rank){
  opts.push({p: rec.top.now, label:'THE APP SAYS'});
  seen.add(rec.top.now[3]);
 }

 const cands = av()
   .filter(p=>p[0]!==rank && legal(ti,p[3]))
   .filter(p=>!opts.some(o=>o.p[0]===p[0]))
   .filter(p=>{ if(p[3]==='QB' && picks.length+1 < QB_FLOOR) return false; return true; });
 for(const p of cands){
  if(opts.length>=3) break;
  if(seen.has(p[3])) continue;
  seen.add(p[3]);
  opts.push({p, label:'INSTEAD'});
 }
 if(opts.length<3){
  const nxt = cands.find(p=>!opts.some(o=>o.p[0]===p[0]));
  if(nxt) opts.push({p:nxt, label:'INSTEAD'});
 }
 /* average a few playouts here too, so the modal and The Pick are measuring
    the same thing the same way. A single run is too noisy to trust. */
 /* average two playouts — one run is noisy because the bots draft with
    randomness, and Andre shouldn't see a number that changes if he taps twice */
 return opts.map(o=>{
  const a = simulate(o.p[0], ti), b = simulate(o.p[0], ti);
  return {...o, sim: {...a, strength: Math.round((a.strength + b.strength)/2)}};
 });
}

/* ============================================================
   THE PICK ENGINE — the only question that matters:
   "Which pick, right now, does the most for my STARTING lineup?"

   Not best-available. Best-available-adjusted-for-what-survives.
   If the top RB and the top TE are equally good, but 6 more good
   RBs live to my next pick and ZERO good TEs do — take the TE.
   ============================================================ */

/* Starting lineup: 1QB 2RB 3WR 1TE 1FLEX 1K 1DEF.
   Bench guys don't score points. Only starters matter. */
/* Andre confirmed the final lineup: 1 QB, 2 RB, 2 WR, 1 TE, 1 FLEX, 1 K, 1 DEF.
   The flex REPLACED the third receiver -- it didn't add a 10th starter. */
const STARTERS = {QB:1, RB:2, WR:2, TE:1, K:1, DST:1};
const FLEXABLE = ['RB','WR','TE'];

/* WHAT A PLAYER IS WORTH.

   We used to measure this in blended RANK — and that was wrong. Rank is a
   queue position, not a value. Moving from RB20 to RB10 and from TE20 to
   TE10 look identical in rank, but the TE jump is worth far more, because
   there are only ~7 tight ends worth starting and dozens of running backs.

   ESPN prices every player in AUCTION DOLLARS for a 10-team $200 league —
   exactly our shape. That IS the value. Use it. Fall back to a rank-derived
   estimate only for the backfilled guys ESPN never priced. */
function val$(p){
 if(p[14] !== undefined && p[14] !== null && p[13]) return p[14];
 /* not priced by ESPN (backfilled K/DEF and deep bench) — worth ~nothing */
 /* how much he beats replacement by, on a 0-20ish scale */
 return Math.max(0, Math.round(VOR(p) / 12));
}

/* How much does this player improve my STARTING lineup, in dollars? */
function lineupGain(ti, p){
 const ps = p[3];
 const have = ros(ti).filter(x=>x[3]===ps).sort((a,b)=>PROJ(b)-PROJ(a));
 const slots = STARTERS[ps];

 /* he'd be my Nth-best at the position */
 const slot = have.filter(x=>PROJ(x) > PROJ(p)).length;

 if(slot < slots){
  /* he starts — gain is what he's worth minus the guy he pushes to the bench */
  const displaced = have[slots-1];
  return Math.max(0, val$(p) - (displaced ? val$(displaced) : 0));
 }
 /* doesn't start at his position — does he beat my flex? */
 if(FLEXABLE.includes(ps)){
  const fx = bestFlex(ti);
  return Math.max(0, val$(p) - (fx ? val$(fx) : 0));
 }
 return 0;                                            // pure bench: no lineup value
}
/* who currently holds my flex spot */
function bestFlex(ti){
 const r = ros(ti);
 const spare = [];
 FLEXABLE.forEach(ps=>{
  const at = r.filter(x=>x[3]===ps).sort((a,b)=>PROJ(b)-PROJ(a));
  spare.push(...at.slice(STARTERS[ps]));              // everyone past the starters
 });
 spare.sort((a,b)=>PROJ(b)-PROJ(a));
 return spare[0] || null;
}

/* When is my NEXT pick after this one? */
function nextPickNum(ti){
 for(let n = picks.length + 2; n <= TOT(); n++){ if(tAt(n) === ti) return n }
 return null;                                         // this is my last pick
}

/* Who will STILL BE HERE when I pick again?

   The board slot (p[5]) IS the 10-team draft order — that's the whole point
   of using ESPN's 10-team sheet. A guy whose slot is 49 gets taken around
   pick 49. So if my next pick is #61, anyone with a slot under ~61 is GONE.

   I add a small cushion because real rooms don't draft perfectly to the
   sheet — but a 20-pick gap is a 20-pick gap, and the cliff is real. */
function survivesToNextPick(ti, ps){
 const nxt = nextPickNum(ti);
 if(nxt === null) return [];                          // no next pick — take him now

 /* A board slot is an AVERAGE, not a promise. A guy who "goes around 40" is
    gone before pick 33 a good chunk of the time. The old code used
    `p[5] >= nxt - 4`, which counted him as a sure thing and made the app tell
    Andre "safe to wait" on players who were about to disappear.
    Require real daylight: his slot has to sit clearly PAST my next pick. */
 const CUSHION = 8;
 return av().filter(p => p[3]===ps && p[5] >= nxt + CUSHION);
}

/* THE RECOMMENDATION */
/* ============================================================
   THE FINAL CHECK — does the recommendation survive a full playout?

   Andre caught this: the app told him "take Gibbs" and then, right below,
   showed McBride finishing 97 points HIGHER. Two different brains.

   bestPick is GREEDY — it scores this pick on who helps the lineup right now,
   plus scarcity, plus what it costs to wait. That's fast and mostly right.

   playouts is HONEST — it drafts all 20 rounds out for each option and adds up
   the starting lineup you'd actually finish with. That accounts for what you
   can still get later, which greedy scoring can't fully see.

   When they disagree, the playout wins. So: take bestPick's top few candidates,
   play each one out to round 20, and recommend whichever actually ends with the
   best team. The app should never argue with itself in front of him again.
   ============================================================ */
function verifyByPlayout(ti, cands){
 if(!cands.length) return null;
 let best=null, bs=-1e9;
 cands.slice(0,4).forEach(p=>{
  const s = simulate(p[0], ti).strength;
  if(s > bs){ bs = s; best = p; }
 });
 return best;
}

function bestPick(ti){
 let pool = av().filter(p => legal(ti,p[3]) && !isTrap(p));
 if(!pool.length) pool = av().filter(p => legal(ti,p[3]));   // forced: legality wins
 if(!pool.length) return null;

 const pl    = lft(ti);
 const req   = POS.reduce((s,q)=>s+shy(ti,q), 0);
 const slack = pl - req;
 const pick  = picks.length + 1;

 const rows = [];
 POS.forEach(ps=>{
  /* Sort by PROJECTED POINTS, not by consensus rank.
     This was the bug Andre caught: the engine took De'Von Achane (322 proj,
     consensus rank 10) over Jahmyr Gibbs (364 proj, rank 12) purely because
     Achane ranked higher -- then the playout panel correctly showed Gibbs
     finishing 77 points ahead. Half the app drafted on rankings, half on
     points. Points win: they're what actually scores. */
  const at = pool.filter(p=>p[3]===ps).sort((a,b)=>PROJ(b)-PROJ(a));
  if(!at.length) return;

  const now   = at[0];
  const later = survivesToNextPick(ti, ps).filter(p=>!isTrap(p) && legal(ti,ps))
                  .sort((a,b)=>PROJ(b)-PROJ(a))[0];

  const gainNow   = lineupGain(ti, now);
  const gainLater = later ? lineupGain(ti, later) : 0;
  /* THE COST OF WAITING: what you give up by not taking this position now */
  const cost = gainNow - gainLater;

  /* THE CLIFF: how far is the drop from the best guy left to the NEXT guy?
     A position with 7 startable players and a 30-point gap after #7 is a
     ticking clock even when today's cost of waiting reads zero. */
  const startable = at.filter(p => isStartable(p));
  const cliff = (startable.length >= 1 && at.length > startable.length)
    ? Q(at[startable.length]) - Q(at[startable.length-1])
    : 0;

  rows.push({
   ps, now, later,
   gainNow, gainLater,
   cost,
   cliff,
   startable: startable.length,
   need: shy(ti,ps),
   survivors: survivesToNextPick(ti,ps).length
  });
 });

 /* ---- SCORE each position ---- */
 rows.forEach(r=>{
  let s = r.gainNow;                     // how much he helps my lineup TODAY
  s += r.cost * 1.35;                    // ...plus how much waiting would cost

  /* THE REAL NUMBER -- what he actually beat a replacement starter by last
     year, in THIS league's scoring. See the VOR comment up top. This is what
     makes the engine take RB/WR early and wait on QB. */
  s += VOR(r.now) * 0.42;

  /* ===== CAPITALIZE ON THE ROOM =====
     Andre's ask: when the room reaches, take the guy they left behind.

     A FALLER is a player still sitting there well past his board slot —
     somebody reached, so he slid. Free value. Take him.

     A RUN means the opposite: three QBs just went in twelve picks, so if I
     still need one, the good ones are evaporating and I should move NOW
     instead of getting stuck with the leftovers. (In the test draft, three
     managers reached for QBs and the app was still sitting there in round 7
     — it ended up with Jaxson Dart. That's the hole this fixes.) */
  {
   const pk = picks.length + 1;
   const fell = pk - r.now[5];              // how far past his slot he's slid
   if(fell >= 8)  s += Math.min(fell, 35) * 1.6;   // he fell — grab him

   /* if a run is on at a spot I still need, move up my timeline */
   const n = runOn(r.ps, 12);
   if(n >= 3 && shy(ti, r.ps) > 0) s += 45;
   /* ...and if I DON'T need it, stay out of the stampede */
   if(n >= 3 && shy(ti, r.ps) <= 0) s -= 30;
  }

  /* ANDRE'S TE RULE (see ELITE_TE up top). Every TE except McBride is
     interchangeable, so never spend an early pick on one. */
  if(FLAT_TE(r.now)){
   const pk = picks.length + 1;
   if(pk <= 50)  s -= 220;     // rounds 1-5: absolutely not, no exceptions
   else if(pk <= 100) s -= 55; // rounds 6-10: only if he's clearly the best left
  }

  /* HOW MANY OF THIS POSITION DO I STILL NEED TO *START*?
     This is the thing the engine kept missing. Your 4th TE does nothing —
     you start ONE. But your 2nd RB is a starting job. Weight by how many
     STARTING spots at this position are still empty, not by roster slots. */
  const startersHere = ros(ti).filter(x=>x[3]===r.ps).length;
  const startSlotsOpen = Math.max(0, STARTERS[r.ps] - startersHere);

  /* A player who fills an empty STARTING slot is worth far more than a
     bench body, no matter how good he looks in isolation. */
  if(startSlotsOpen > 0) s += 55;

  /* Past your starters? He's bench depth (or flex). Big discount. */
  if(startSlotsOpen === 0){
   const flexable = FLEXABLE.includes(r.ps);
   const fx = bestFlex(ti);
   const flexOpen = flexable && (!fx || PROJ(r.now) > PROJ(fx));
   s -= flexOpen ? 20 : 70;              // flex is real; pure bench is not
  }

  /* SCARCITY — but scarcity NEVER beats raw production at the top.
     Trey McBride is the best TE alive and he still only scores like the
     10th-best skill player. Taking him over Chase/Gibbs/Bijan because
     "TEs are scarce" hands away 70 points a season. Scarcity is a
     tiebreaker between similar players, not a licence to reach. */
  const nowIsStarter = isStartable(r.now);
  if(startSlotsOpen > 0 && nowIsStarter && r.startable > 0 && r.startable <= 6){
   s += (7 - r.startable) * 26;
  }
  if(startSlotsOpen > 0 && nowIsStarter && r.startable <= 2) s += 60;

  /* THE ELITE-PLAYER RULE.
     In the first ~15 picks the board still has genuine difference-makers.
     Nothing — no scarcity, no positional need — justifies passing on one.
     Take the best player. Positional games start AFTER the elite are gone. */
  /* round 1-2: don't reach for someone who isn't genuinely elite.
     (was a RANK test; now: is he top-16 by projected points?) */
  if(pick <= 16){

/* ============================================================
   THE FORK — "what if I take a different position instead?"

   Andre asked for this directly: when the app says take a TE and he wants a
   RB, don't just argue — SHOW HIM BOTH TEAMS and the point difference.

   How it works: we take his roster, pretend he drafted the guy, then simulate
   the rest of his draft (board order, one pick per turn, filling needs) and
   score the starting 10. Do it once for the app's pick, once for the position
   he's eyeing. The difference in season points is the honest answer.
   ============================================================ */

/* project a player's 2026 season in THIS league's scoring.
   Uses last year where we have it (adjusted for injury), else falls back to
   board position. Not gospel — but it's the same yardstick for both sides of
   the fork, so the DIFFERENCE is meaningful even if the absolute is rough. */
function proj(p){
 if(!p) return 0;
 if(LY(p) > 0){
  /* a guy who missed time gets judged on pace, not his shortened total */
  const base = HURT(p) ? PACE(p) : LY(p);
  return base;
 }
 /* no history (rookie, or didn't play): estimate off board slot */
 const ps = p[3], b = p[5];
 if(ps==='QB')  return Math.max(380, 640 - b*1.6);
 if(ps==='RB')  return Math.max(70,  330 - b*1.5);
 if(ps==='WR')  return Math.max(70,  330 - b*1.4);
 if(ps==='TE')  return Math.max(60,  260 - b*1.3);
 if(ps==='K')   return 135;
 return 100;
}

/* score a starting lineup (the 10 that actually play each week) */
function scoreLineup(roster){
 const by = {};
 POS.forEach(q=>{ by[q] = roster.filter(x=>x[3]===q).sort((a,b)=>proj(b)-proj(a)) });
 const used = new Set();
 const take = (ps,i)=>{ const p=by[ps]&&by[ps][i]; if(p) used.add(p[0]); return p; };
 /* 1 QB, 2 RB, 2 WR, 1 TE -- then the flex, K, DEF below */
 const st = [take('QB',0),take('RB',0),take('RB',1),
             take('WR',0),take('WR',1),take('TE',0)];
 /* flex = best remaining RB/WR/TE */
 let fx=null, fb=-1;

/* simulate the REST of my draft after taking `first` right now.
